<!DOCTYPE html>
<!--
PROTOTYPE — prototypes/web/index_full_validation.html
Fork of index_polygon.html (untouched — see this codebase's "copy, don't
edit a validated checkpoint" convention). Backed by server_full_validation.py
instead of server_polygon.py. Adds ONE new state to the flow — the
"needs_clarification" card — and a notes banner inside the map view.
Throwaway. Do not promote to production.

Six JS-swapped states in one page (no navigation/reload); states -1, 0, 1
unchanged from index_polygon.html:
  -1. (intro card) — welcome/onboarding.
  0. #view-draw     — full-screen map with a polygon draw tool.
  1. #view-form     — landing form: drawn-area summary, NL query textarea.
  2. #view-loading  — generic spinner + rotating quest-flavoured status text.
  3. #view-clarify  — NEW. Shown only for case 1/4 (no taxonomic signal, or a
                      resolved filter that found nothing here). Message +
                      two buttons: "Try a different query" (client-side only,
                      back to the form) and "Show most-observed instead"
                      (re-calls /gbif-species-query with override:true).
                      Pipeline never reaches /run-walk from here without one
                      of these two explicit clicks.
  4. #view-map      — the adventure-style "Quest Log" map/journal UI, now
                      also rendering a notes banner (case 2/3 — fewer than 5
                      species found, or overlapping waypoints) passed
                      through from whichever call actually resolved the walk.

Sequence per query submission:
  1. POST /gbif-species-query (STEPS 1-5 only, cheap).
  2. status "ok" (with or without notes) -> proceed straight to /run-walk
     automatically — the search that ran is exactly what was asked for.
  3. status "needs_clarification" -> STOP. Show view-clarify. Only an
     explicit button click continues the flow (see above) — never silent.

Duplication vs generate_quest_log_map() is a deliberate, session-agreed
choice — matches this codebase's established "prototypes stay standalone"
convention rather than extracting a shared asset for a still-throwaway UI.
-->

  /* ═══════════════ Quest Log map view (ported from e2e_walk_spike.py Variant A) ═══════════════ */
  .qa-root { position: absolute; inset: 0; background: #1b1f18; }

<body>
<div id="app"></div>

<script>
const LOADING_MESSAGES = [
  "Consulting the biodiversity records...",
  "Scouting your drawn area for waypoints...",
  "Charting the route between sightings...",
  "Writing your quest log...",
  "Sketching the map...",
];

let leafletMap = null;
let lastQuery = "";
let drawnPolygon = null; // array of [lat, lon] vertices, or null until confirmed

const SPECIES_COLORS = ["#e41a1c", "#377eb8", "#4daf4a", "#ff7f00", "#984ea3"];

function destroyMap() {
  if (leafletMap) { leafletMap.remove(); leafletMap = null; }
}

// ═══════════════════════ Query flow: /gbif-species-query -> /run-walk ═══════════════════════
async function submitQuery(query) {
  showLoading();
  lastQuery = query;
  await queryAndProceed(query, false);
}

async function queryAndProceed(query, override) {
  try {
    const resp = await fetch('/gbif-species-query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, polygon: drawnPolygon, override }),
    });
    const data = await resp.json();
    if (!resp.ok || data.status === 'error') {
      showForm(data.message || 'Something went wrong checking this query.');
      return;
    }
    if (data.status === 'needs_clarification') {
      showClarify(query, data.message);
      return;
    }
    // status "ok" — this IS the search the user asked for (whether clean or
    // via override), so proceed straight to /run-walk with no further click.
    await runWalk(query, data.species, data.notes);
  } catch (err) {
    showForm('Could not reach the server: ' + err.message);
  }
}

async function runWalk(query, species, notes) {
  showLoading();
  try {
    const resp = await fetch('/run-walk', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, species, notes }),
    });
    const data = await resp.json();
    if (!resp.ok || data.status !== 'ok') {
      showForm(data.message || 'Something went wrong generating this walk.');
      return;
    }
    renderMapView(data);
  } catch (err) {
    showForm('Could not reach the server: ' + err.message);
  }
}

// ═══════════════════════ STATE -1 — Welcome / onboarding ═══════════════════════
function showIntro() {
  destroyMap();
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="qw-center-stage">
      <div class="qw-card">
        <h1>⚔ A Nature Quest</h1>
        <div class="qw-subtitle">Discover the wild life of any area you choose</div>
        <ol class="qw-intro-steps">
          <li>Draw a shape on the map around the area you want to explore.</li>
          <li>Tell us what you'd like to discover there (e.g. "show me some birds").</li>
          <li>Get a guided walk through that area's real, recorded sightings.</li>
        </ol>
        <button id="qw-start-drawing" class="qw-submit">Start Drawing</button>
      </div>
    </div>
  `;
  document.getElementById('qw-start-drawing').onclick = () => showDraw();
}

// ═══════════════════════ STATE 0 — Draw your own area ═══════════════════════
function showDraw() {
  destroyMap();
  const app = document.getElementById('app');
  app.innerHTML = `
    <div id="view-draw">
      <div id="qw-draw-map"></div>
      <div id="qw-draw-banner">
        <h2>⚔ Draw Your Quest Area</h2>
        <p>Use the polygon tool (top-left corner of the map) to click out the edges of your area, then click the first point again to close the shape. When you're happy with it, press Confirm Area below.</p>
      </div>
      <div id="qw-draw-actions">
        <button id="qw-draw-clear" type="button">Clear</button>
        <button id="qw-draw-confirm" type="button" disabled>Confirm Area</button>
      </div>
    </div>
  `;

  leafletMap = L.map('qw-draw-map').setView([40.4153, -3.6844], 14);
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap (CC-BY-SA)',
    maxZoom: 17,
  }).addTo(leafletMap);

  const drawnItems = new L.FeatureGroup();
  leafletMap.addLayer(drawnItems);
  const drawControl = new L.Control.Draw({
    draw: { polygon: true, marker: false, circle: false, circlemarker: false, rectangle: false, polyline: false },
    edit: { featureGroup: drawnItems, remove: false },
  });
  leafletMap.addControl(drawControl);

  const confirmBtn = document.getElementById('qw-draw-confirm');
  function updateConfirmState() {
    confirmBtn.disabled = drawnItems.getLayers().length === 0;
  }

  leafletMap.on(L.Draw.Event.CREATED, (e) => {
    drawnItems.clearLayers();
    drawnItems.addLayer(e.layer);
    updateConfirmState();
  });
  leafletMap.on(L.Draw.Event.EDITED, updateConfirmState);
  leafletMap.on(L.Draw.Event.DELETED, updateConfirmState);

  document.getElementById('qw-draw-clear').onclick = () => {
    drawnItems.clearLayers();
    updateConfirmState();
  };
  confirmBtn.onclick = () => {
    const layers = drawnItems.getLayers();
    if (!layers.length) return;
    drawnPolygon = layers[0].getLatLngs()[0].map(ll => [ll.lat, ll.lng]);
    showForm();
  };
}

// ═══════════════════════ STATE 1 — Landing form ═══════════════════════
function showForm(errorMessage) {
  destroyMap();
  const app = document.getElementById('app');
  const areaSummary = drawnPolygon
    ? `Custom area selected (${drawnPolygon.length} points) — <a href="#" id="qw-redraw">redraw</a>`
    : `No area drawn yet — <a href="#" id="qw-redraw">draw one</a>`;
  app.innerHTML = `
    <div class="qw-center-stage">
      <div class="qw-card">
        <h1>⚔ A Nature Quest</h1>
        <div class="qw-subtitle">Discover the wild life of the area you drew</div>
        <form id="qw-form">
          <div class="qw-field">
            <label for="qw-custom-area">Quest area</label>
            <div class="qw-hint">${areaSummary}</div>
          </div>
          <div class="qw-field">
            <label for="qw-query">What do you want to discover?</label>
            <textarea id="qw-query" placeholder="e.g. Today I want to learn about plants">${lastQuery ? lastQuery.replace(/"/g, '&quot;') : ''}</textarea>
          </div>
          <div class="qw-examples">
            Try: ${['Today I want to learn about plants', 'Show me something colourful', 'Show me a mix of birds, plants and mammals']
              .map(ex => `<button type="button" data-ex="${ex.replace(/"/g, '&quot;')}">${ex}</button>`).join(' &middot; ')}
          </div>
          <button type="submit" class="qw-submit" ${drawnPolygon ? '' : 'disabled'}>Begin Your Quest</button>
        </form>
        ${errorMessage ? `<div class="qw-error">${errorMessage}</div>` : ''}
      </div>
    </div>
  `;
  document.getElementById('qw-redraw').onclick = (e) => { e.preventDefault(); showDraw(); };
  document.querySelectorAll('.qw-examples button').forEach(btn => {
    btn.onclick = () => { document.getElementById('qw-query').value = btn.dataset.ex; };
  });
  document.getElementById('qw-form').onsubmit = (e) => {
    e.preventDefault();
    const query = document.getElementById('qw-query').value.trim();
    if (!query || !drawnPolygon) return;
    submitQuery(query);
  };
}

// ═══════════════════════ STATE 2 — Loading ═══════════════════════
function showLoading() {
  destroyMap();
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="qw-center-stage">
      <div class="qw-card" style="text-align:center">
        <div class="qw-spinner"></div>
        <h1 style="font-size:17px">Preparing your quest...</h1>
        <div class="qw-loading-text" id="qw-loading-text">${LOADING_MESSAGES[0]}</div>
      </div>
    </div>
  `;
  let i = 0;
  const el = document.getElementById('qw-loading-text');
  const interval = setInterval(() => {
    if (!el || !document.body.contains(el)) { clearInterval(interval); return; }
    i = (i + 1) % LOADING_MESSAGES.length;
    el.textContent = LOADING_MESSAGES[i];
  }, 2200);
}

// ═══════════════════════ STATE 3 (NEW) — needs_clarification ═══════════════════════
function showClarify(query, message) {
  destroyMap();
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="qw-center-stage">
      <div class="qw-card">
        <div class="qw-clarify-icon">🔍</div>
        <h1 style="font-size:18px">Before we build your walk...</h1>
        <div class="qw-clarify-message">${message}</div>
        <button id="qw-try-again" class="qw-submit">Try a different query</button>
        <button id="qw-proceed-default" class="qw-secondary">Show most-observed instead</button>
      </div>
    </div>
  `;
  document.getElementById('qw-try-again').onclick = () => showForm();
  document.getElementById('qw-proceed-default').onclick = async () => {
    showLoading();
    await queryAndProceed(query, true); // override:true — user's explicit click authorizes this
  };
}

// ═══════════════════════ STATE 4 — Quest Log map ═══════════════════════
function openQuestModal(species, i) {
  const s = species[i];
  const backdrop = document.createElement('div');
  backdrop.className = 'qa-modal-backdrop';
  backdrop.innerHTML = `
    <div class="qa-modal">
      <span class="qa-close">✕</span>
      <div style="font-size:11px;letter-spacing:1px;color:#7a5a2d">QUEST ENTRY ${i + 1}/${species.length}</div>
      <h3 style="margin:4px 0 0">${s.name}</h3>
      <div style="font-style:italic;color:#7a5a2d;font-size:12px">${s.sci}</div>
      ${s.img ? `<img src="${s.img}"/>` : ''}
      <p style="font-size:13px;line-height:1.5">${s.desc}</p>
      <p style="font-size:11px;color:#7a5a2d;margin-top:10px">${(s.points || []).length} recorded observations — see the small dots on the map for the full spread.</p>
    </div>
  `;
  backdrop.querySelector('.qa-close').onclick = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
  document.body.appendChild(backdrop);
}

function renderMapView(data) {
  destroyMap();
  const species = data.species;
  const intro = data.intro;
  const waypoints = data.waypoints;
  const notes = data.notes || [];

  const lats = species.map(s => s.lat);
  const lons = species.map(s => s.lon);
  const center = [lats.reduce((a, b) => a + b, 0) / lats.length, lons.reduce((a, b) => a + b, 0) / lons.length];
  const routeCoords = species.map(s => [s.lat, s.lon]);

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="qa-root">
      <div class="qa-titlebar">⚔ A Nature Quest</div>
      ${notes.length ? `<div class="qa-notes">${notes.map(n => `<div>${n}</div>`).join('')}</div>` : ''}
      <div class="qa-journal-tab" id="qa-tab">QUEST LOG</div>
      <div class="qa-journal" id="qa-journal">
        <h2>Quest Log</h2>
        <p style="font-size:13px;line-height:1.6;margin-bottom:16px">${intro}</p>
        ${species.map((s, i) => `
          <details class="qa-entry" data-idx="${i}">
            <summary><span class="qa-num">${i + 1}</span> ${s.name}</summary>
            <div class="qa-entry-body">${waypoints[i]}</div>
          </details>
        `).join('')}
      </div>
      <div class="qa-map-wrap">
        <div id="qa-map" class="map-fill"></div>
      </div>
      <div id="qa-regen-bar">
        <input id="qa-regen-input" type="text" placeholder="Ask for a new walk, e.g. 'show me insects'"/>
        <button id="qa-regen-btn">New Walk</button>
        <button id="qa-new-area-btn" title="Draw a different area">New Area</button>
      </div>
    </div>
  `;
  document.getElementById('qa-tab').onclick = () => document.getElementById('qa-journal').classList.toggle('open');

  leafletMap = L.map('qa-map').setView(center, 15);
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap (CC-BY-SA)',
    maxZoom: 17,
  }).addTo(leafletMap);
  L.polyline(routeCoords, { color: '#333', weight: 2.5, opacity: 0.55, dashArray: '8,7' }).addTo(leafletMap);

  let openDetail = null;
  species.forEach((s, i) => {
    // Raw occurrence points for this species — built but not added to the
    // map until this species' marker is clicked (shows the full recorded
    // spread behind the single hotspot marker, not just the cluster itself).
    const color = SPECIES_COLORS[i % SPECIES_COLORS.length];
    const detailLayer = L.layerGroup();
    (s.points || []).forEach(p => {
      L.circleMarker(p, { radius: 5, color: '#111', weight: 1.5, fillColor: color, fillOpacity: 0.95 }).addTo(detailLayer);
    });

    const icon = L.divIcon({ html: `<div class="qa-marker-medallion">${i + 1}</div>`, iconSize: [36, 36], iconAnchor: [18, 18], className: '' });
    L.marker([s.lat, s.lon], { icon }).addTo(leafletMap).on('click', () => {
      if (openDetail === detailLayer) {
        leafletMap.removeLayer(detailLayer);
        openDetail = null;
      } else {
        if (openDetail) leafletMap.removeLayer(openDetail);
        detailLayer.addTo(leafletMap);
        openDetail = detailLayer;
      }
      openQuestModal(species, i);
    });
  });

  const regenBtn = document.getElementById('qa-regen-btn');
  const regenInput = document.getElementById('qa-regen-input');
  const doRegen = () => {
    const q = regenInput.value.trim();
    if (!q) return;
    regenBtn.disabled = true;
    submitQuery(q);
  };
  regenBtn.onclick = doRegen;
  regenInput.onkeydown = (e) => { if (e.key === 'Enter') doRegen(); };
  document.getElementById('qa-new-area-btn').onclick = () => {
    drawnPolygon = null;
    showDraw();
  };
}

showIntro();
</script>
</body>
</html>
