<!DOCTYPE html>
<!--
PROTOTYPE — map_narrative_layout_prototype_v2.html
Throwaway UI prototype. Do not promote to production as-is.
Forked from map_narrative_layout_prototype.html (kept as-is for reference/history).

Question: what should the map + narrative layout look like for a game-like
adventure walk (Pokemon Go / Zelda / Minecraft feel)?

v1 swapped stock OSM tiles for OpenTopoMap + CSS filters — rejected by the user
as still reading as "a real map with a filter," not designed game cartography.
v2 replaces the tile provider entirely with a VECTOR RE-SKIN: real Retiro Park
geometry (park boundary, lakes, footpaths), captured once via the raw OSM REST
API (api.openstreetmap.org/api/0.6/map.json — the same endpoint
overpass_spike.py already uses; Overpass itself was tried and rejected again
this session, a public instance 504'd), rendered as styled vector shapes with
a genuinely different treatment per variant — not a filter, a different
rendering approach. No live OSM/Overpass calls happen in this file at all; see
PARK_GEO below and WORK_SUMMARY_190726.md Session 2 for the capture method.
This does NOT yet solve live/arbitrary-location map generation (flagged by the
user as a real open question for later) — this round is Retiro-only, fixed data.

  A — "Quest Log" (adventure-style): slide-out parchment journal, accordion narrative,
      modal quest-entry per species with a "mark discovered" action. Map:
      flat parchment fill, ink-dashed trails, under a wood/glass frame.
  B — "PokéStop" (Pokemon Go): full-bleed map, top XP/discovery bar, pulsing
      circular markers, bottom-sheet species card, floating Story overlay.
      Map: candy-flat shapes with a drop-shadow "diorama" pop.
  C — "Inventory" (Minecraft): split map + blocky inventory-slot sidebar that
      fills in per species, pixel-font achievement log underneath. Map: real
      geometry grid-snapped onto a coarse lattice for genuine blockiness.

Run: open this file directly in a browser, e.g.
  open prototypes/ux/map_narrative_layout_prototype_v2.html
-->

<script>
// ─────────────────────────────────────────────────────────────
// Shared data — captured verbatim from
// prototypes/artifacts/retiro_narrative_map_cost_experiment2_claude_haiku_4_5_20251001.html

const SPECIES = [

    lat: 40.414847925925926, lon: -3.684565037037037,

// Narrative split per-waypoint for the accordion/log variants. Paragraph 1 is
// the scene-setting intro (stray leading "# " markdown header from the raw
// Haiku output stripped — a known quirk noted in WORK_SUMMARY_190726.md, not
// meaningful content).
const NARRATIVE_INTRO = "Welcome to Retiro Park, Madrid—a sanctuary where continents converge and the natural world reveals its most extraordinary secrets. We begin our expedition at the crystalline edge of discovery, where an unexpected visitor awaits.";
const NARRATIVE_BY_SPECIES = [
  "Here, at our first waypoint, we encounter the black-billed magpie, a corvid whose very presence in these Spanish gardens speaks to the mysteries of migration and adaptation. Notice the striking contrast of its black and white plumage, and if the light catches just so, you'll glimpse the iridescent blues and blue-greens that shimmer across its wings and tail like captured sky. This remarkable bird, long confused with its Eurasian cousin, was only recognized as a distinct species through genetic revelation in the year 2000—a reminder that nature still holds secrets waiting to be unlocked.",
  "As we move deeper into the park's verdant heart, we're drawn toward the ancient oaks by a distinctive sound—a hiss-like, sibilant call that seems to emerge from the very wood itself. This is the realm of the Iberian green woodpecker, a medium-sized artisan of the trees found nowhere else on Earth save the Iberian peninsula itself. Observe the subtle darkness around its eye and the refined black markings on its head, features that distinguish it from its European relatives. Here is a creature perfectly adapted to these particular woods, a living embodiment of biogeographic distinctiveness.",
  "Our journey now leads us to water, where the park's lakes shimmer in the afternoon light. The Egyptian goose glides gracefully across the surface—an African wanderer who, thanks to centuries of human fascination as an ornamental bird, has established itself far from its native Nile. The ancients revered this species in their hieroglyphics; today it graces Madrid's waters.",
  "Beyond it glides a more recent arrival: the black swan, that magnificent Australian native with its obsidian plumage and brilliant crimson bill. Against Europe's pale waterfowl, it seems almost impossibly exotic, yet here it thrives, both parents devoted to their young.",
  "And finally, completing our circuit, we return to the familiar—the common mallard, humanity's most widely distributed duck, gathered in companionable flocks as they have been for millennia across the world's wetlands. In Retiro's waters, all the world's birds meet, telling the story of nature in our modern age."
];
const CENTER = [40.41448570055702, -3.683170076146829];
const ROUTE_COORDS = SPECIES.map(s => [s.lat, s.lon]);

// Real Retiro Park geometry — captured once via the raw OSM REST API
// (api.openstreetmap.org/api/0.6/map.json, the same endpoint overpass_spike.py
// already used; Overpass itself was tried and rejected again this session —
// a public instance 504'd — so this is deliberately NOT a live call at
// runtime). park_hull is a convex-hull approximation (Retiro's true boundary
// is mapped as an OSM relation, which this REST endpoint doesn't return —

let leafletMap = null; // tracked so each variant switch can .remove() the previous instance

function destroyMap() {
  if (leafletMap) { leafletMap.remove(); leafletMap = null; }
}

// Grid-snap coordinates onto a coarse lattice — used only by Variant C to turn
// real smooth park/lake/trail geometry into a genuinely blocky/voxel silhouette
// (not a filter faking it: the jagged edges are the real data, just quantized).
function snapToGrid(coords, step) {
  return coords.map(([lat, lon]) => [Math.round(lat / step) * step, Math.round(lon / step) * step]);
}

// No tile provider in any variant — the park hull, lakes and trails are
// rendered as real, styled vector shapes (a "vector re-skin" of actual OSM
// geometry). Each variant gets its own render function because the treatment
// differs structurally, not just by colour: A fills flat and dashes ink
// trails; B duplicates the hull with an offset shadow for a diorama pop;
// C grid-snaps everything for genuine blockiness.

function renderParkGeometryA(map) {
  L.polygon(PARK_GEO.park_hull, { color: '#4a3a26', weight: 3, fillColor: '#8a9a5b', fillOpacity: 0.88 }).addTo(map);
  Object.values(PARK_GEO.lakes).forEach(ring => {
    L.polygon(ring, { color: '#1c2b33', weight: 2, fillColor: '#2f4858', fillOpacity: 0.9 }).addTo(map);
  });
  PARK_GEO.trails.forEach(line => {
    L.polyline(line, { color: '#6b4f2a', weight: 2, opacity: 0.75, dashArray: '1,6', lineCap: 'round' }).addTo(map);
  });
  L.polyline(ROUTE_COORDS, { color: '#c9a227', weight: 3, opacity: 0.9, dashArray: '2,8' }).addTo(map);
}

function renderParkGeometryB(map) {
  const SHADOW_OFFSET = -0.0006; // lat offset, degrees — fakes a diorama drop-shadow
  const shadowHull = PARK_GEO.park_hull.map(([lat, lon]) => [lat + SHADOW_OFFSET, lon]);
  L.polygon(shadowHull, { color: 'transparent', weight: 0, fillColor: '#0d3d22', fillOpacity: 0.35 }).addTo(map);
  L.polygon(PARK_GEO.park_hull, { color: '#ffffff', weight: 3, fillColor: '#37c871', fillOpacity: 0.95 }).addTo(map);
  Object.values(PARK_GEO.lakes).forEach(ring => {
    L.polygon(ring, { color: '#ffffff', weight: 3, fillColor: '#29b6f6', fillOpacity: 0.95 }).addTo(map);
  });
  PARK_GEO.trails.forEach(line => {
    L.polyline(line, { color: '#fff8e1', weight: 4, opacity: 0.9, dashArray: '2,10', lineCap: 'round' }).addTo(map);
  });
  L.polyline(ROUTE_COORDS, { color: '#2b6f4f', weight: 3, opacity: 0.9, dashArray: '4,6', lineCap: 'round' }).addTo(map);
}

function renderParkGeometryC(map) {
  const STEP = 0.00028; // ~31m at this latitude — coarse enough to read as "chunks"
  L.polygon(snapToGrid(PARK_GEO.park_hull, STEP), { color: '#2f4a1e', weight: 2, fillColor: '#5a8f3a', fillOpacity: 0.95, lineJoin: 'miter' }).addTo(map);
  Object.values(PARK_GEO.lakes).forEach(ring => {
    L.polygon(snapToGrid(ring, STEP), { color: '#1c3550', weight: 2, fillColor: '#2f5f8f', fillOpacity: 0.95, lineJoin: 'miter' }).addTo(map);
  });
  PARK_GEO.trails.forEach(line => {
    L.polyline(snapToGrid(line, STEP), { color: '#a9855a', weight: 6, opacity: 0.9, lineCap: 'square', lineJoin: 'miter' }).addTo(map);
  });
  L.polyline(snapToGrid(ROUTE_COORDS, STEP), { color: '#ffd76b', weight: 4, opacity: 0.95, lineCap: 'square' }).addTo(map);
}

function openQuestModal(i) {

  const backdrop = document.createElement('div');
  backdrop.className = 'qa-modal-backdrop';
  backdrop.innerHTML = `
    <div class="qa-modal">
      <span class="qa-close">✕</span>
      <div style="font-size:11px;letter-spacing:1px;color:#7a5a2d">QUEST ENTRY ${s.num}/5</div>
      <h3 style="margin:4px 0 0">${s.name}</h3>
      <div style="font-style:italic;color:#7a5a2d;font-size:12px">${s.sci}</div>
      <img src="${s.img}"/>
      <p style="font-size:13px;line-height:1.5">${s.desc}</p>
      <button class="qa-discover">Mark Discovered</button>
    </div>
  `;
  backdrop.querySelector('.qa-close').onclick = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
  backdrop.querySelector('.qa-discover').onclick = () => {
    const chk = document.querySelector(`[data-check="${i}"]`);
    if (chk) chk.style.visibility = 'visible';
    backdrop.remove();
  };
  document.body.appendChild(backdrop);
}

// ═══════════════════════ VARIANT B — PokéStop ═══════════════════════
let pgDiscovered = new Set();

function renderVariantB(container) {
  pgDiscovered = new Set();
  container.innerHTML = `
    <div class="pg-root">
      <div class="pg-map-wrap">
        <div id="pg-map" class="map-fill"></div>
        <div class="pg-map-glow"></div>
        <div class="pg-map-scan"></div>
      </div>
      <div class="pg-topbar">
        <div class="pg-title">🧭 Retiro Quest</div>
        <div class="pg-xpbar"><div class="pg-xpfill" id="pg-xpfill" style="width:0%"></div></div>
        <div class="pg-count" id="pg-count">0 / 5</div>
      </div>
      <div class="pg-story-fab" id="pg-story-fab" title="Read the story">📖</div>
    </div>
  `;
  destroyMap();
  leafletMap = L.map('pg-map', { attributionControl: false }).setView(CENTER, 15);
  renderParkGeometryB(leafletMap);

  SPECIES.forEach((s, i) => {
    const icon = L.divIcon({
      html: `<div class="pg-pin-wrap" data-pin="${i}">
               <div class="pg-pin-ring"></div>
               <div class="pg-pin-core">${s.num}</div>
             </div>`,
      iconSize: [46, 46], iconAnchor: [23, 23], className: ''
    });
    L.marker([s.lat, s.lon], { icon }).addTo(leafletMap).on('click', () => openPgSheet(i));
  });

  document.getElementById('pg-story-fab').onclick = openPgStory;
}

function updatePgProgress() {
  const pct = Math.round((pgDiscovered.size / SPECIES.length) * 100);
  const fill = document.getElementById('pg-xpfill');
  const count = document.getElementById('pg-count');
  if (fill) fill.style.width = pct + '%';
  if (count) count.textContent = `${pgDiscovered.size} / ${SPECIES.length}`;
  pgDiscovered.forEach(i => {
    const wrap = document.querySelector(`[data-pin="${i}"]`);
    if (wrap) {
      wrap.querySelector('.pg-pin-ring').classList.add('pg-done');
      wrap.querySelector('.pg-pin-core').classList.add('pg-done');
    }
  });
}

function openPgSheet(i) {
  const s = SPECIES[i];
  const backdrop = document.createElement('div');
  backdrop.className = 'pg-sheet-backdrop';
  backdrop.innerHTML = `
    <div class="pg-sheet">
      <div class="pg-handle"></div>
      <img src="${s.img}"/>
      <h3>${s.name}</h3>
      <div class="pg-sci">${s.sci}</div>
      <p>${s.desc}</p>
      <button class="pg-continue">Continue Walking →</button>
    </div>
  `;
  backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
  backdrop.querySelector('.pg-continue').onclick = () => {
    pgDiscovered.add(i);
    updatePgProgress();
    backdrop.remove();
  };
  document.body.appendChild(backdrop);
}

function openPgStory() {
  const overlay = document.createElement('div');
  overlay.className = 'pg-story-overlay';
  overlay.innerHTML = `
    <span class="pg-story-close">✕</span>
    <h2>Your Retiro Walk — Expedition Log</h2>
    <p>${NARRATIVE_INTRO}</p>
    ${NARRATIVE_BY_SPECIES.map(p => `<p>${p}</p>`).join('')}
  `;
  overlay.querySelector('.pg-story-close').onclick = () => overlay.remove();
  document.body.appendChild(overlay);
}

// ═══════════════════════ VARIANT C — Inventory ═══════════════════════
let mcCollected = new Set();

function renderVariantC(container) {
  mcCollected = new Set();
  container.innerHTML = `
    <div class="mc-root">
      <div class="mc-map-pane">
        <div class="mc-map-wrap">
          <div id="mc-map" class="map-fill"></div>
          <div class="mc-map-chunks"></div>
          <div class="mc-map-vignette"></div>
        </div>
      </div>
      <div class="mc-sidebar">
        <div class="mc-sidebar-title">Inventory</div>
        <div class="mc-inventory" id="mc-inventory"></div>
        <div class="mc-detail" id="mc-detail">Tap a marker on the map to collect a species.</div>
        <div class="mc-log-title">Achievement Log</div>
        <div class="mc-log">
          <p>${NARRATIVE_INTRO}</p>
          ${NARRATIVE_BY_SPECIES.map(p => `<p>${p}</p>`).join('')}
        </div>
      </div>
    </div>
  `;
  renderMcInventory();

  destroyMap();
  leafletMap = L.map('mc-map', { attributionControl: false }).setView(CENTER, 15);
  renderParkGeometryC(leafletMap);

  SPECIES.forEach((s, i) => {
    const icon = L.divIcon({ html: `<div class="mc-marker-block">${s.num}</div>`, iconSize: [30, 30], iconAnchor: [15, 15], className: '' });
    L.marker([s.lat, s.lon], { icon }).addTo(leafletMap).on('click', () => collectMcSpecies(i));
  });
}

function renderMcInventory() {
  const grid = document.getElementById('mc-inventory');
  grid.innerHTML = SPECIES.map((s, i) => `
    <div class="mc-slot ${mcCollected.has(i) ? '' : 'mc-locked'}" data-slot="${i}">
      <span class="mc-slot-num">${s.num}</span>
      ${mcCollected.has(i) ? `<img src="${s.img}"/>` : ''}
    </div>
  `).join('');
  grid.querySelectorAll('.mc-slot').forEach(el => {
    el.onclick = () => {
      const i = parseInt(el.dataset.slot, 10);
      if (mcCollected.has(i)) showMcDetail(i);
    };
  });
}

function collectMcSpecies(i) {
  mcCollected.add(i);
  renderMcInventory();
  showMcDetail(i);
}

function showMcDetail(i) {
  const s = SPECIES[i];
  document.getElementById('mc-detail').innerHTML = `
    <h4>${s.name}</h4>
    <div class="mc-sci">${s.sci}</div>
    <div style="margin-top:6px">${s.desc}</div>
  `;
}

// ─────────────────────────────────────────────────────────────
// Switcher — floating bottom bar, ?variant= URL param, ← → keys
// ─────────────────────────────────────────────────────────────
const VARIANTS = {
  A: { name: 'Quest Log (adventure-style)', render: renderVariantA },
  B: { name: 'PokéStop (Pokemon Go)', render: renderVariantB },
  C: { name: 'Inventory (Minecraft)', render: renderVariantC },
};
const ORDER = ['A', 'B', 'C'];

function currentVariantKey() {
  const params = new URLSearchParams(location.search);
  const v = params.get('variant');
  return ORDER.includes(v) ? v : 'A';
}

function setVariant(key) {
  const params = new URLSearchParams(location.search);
  params.set('variant', key);
  history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
  render();
}

function render() {
  const key = currentVariantKey();
  const container = document.getElementById('app');
  VARIANTS[key].render(container);
  document.getElementById('proto-label').textContent = `${key} — ${VARIANTS[key].name}`;
}

document.getElementById('proto-prev').onclick = () => {
  const idx = ORDER.indexOf(currentVariantKey());
  setVariant(ORDER[(idx - 1 + ORDER.length) % ORDER.length]);
};
document.getElementById('proto-next').onclick = () => {
  const idx = ORDER.indexOf(currentVariantKey());
  setVariant(ORDER[(idx + 1) % ORDER.length]);
};
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable)) return;
  if (e.key === 'ArrowLeft') document.getElementById('proto-prev').click();
  if (e.key === 'ArrowRight') document.getElementById('proto-next').click();
});
window.addEventListener('popstate', render);

render();
</script>
</body>
</html>
