<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PROTOTYPE — full validation quest log</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  .map-fill { position: absolute; inset: 0; }
  #run-banner {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5000;
    background: #111; color: #ffd700; padding: 6px 14px; border-radius: 999px;
    font-size: 11px; font-family: monospace; border: 2px solid #ffd700; max-width: 80vw;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .qa-root { position: absolute; inset: 0; background: #1b1f18; }
  .qa-titlebar {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: linear-gradient(#3a2f22, #2a2118); color: #e8d9b5; padding: 8px 24px;
    border: 2px solid #8a7346; border-radius: 6px; font-family: Georgia, serif;
    font-size: 16px; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  .qa-notes {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: rgba(139, 94, 24, .95); color: #fff3d6; padding: 10px 18px; border-radius: 8px;
    font-family: Georgia, serif; font-size: 13px; max-width: 70vw; text-align: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.4); line-height: 1.5;
  }
  .qa-notes div { margin-bottom: 4px; }
  .qa-notes div:last-child { margin-bottom: 0; }
  .qa-journal-tab {
    position: absolute; top: 90px; left: 0; z-index: 1000; background: #4a3a26;
    color: #e8d9b5; padding: 14px 8px; border-radius: 0 8px 8px 0; cursor: pointer;
    font-family: Georgia, serif; writing-mode: vertical-rl; border: 2px solid #8a7346;
    border-left: none; box-shadow: 3px 3px 10px rgba(0,0,0,.4); font-size: 13px;
  }
  .qa-journal {
    position: absolute; top: 0; left: -380px; width: 380px; height: 100%; z-index: 999;
    background: #f3e6c8 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4"><rect width="4" height="4" fill="%23f3e6c8"/><circle cx="1" cy="1" r=".4" fill="%23e3d3ab"/></svg>');
    border-right: 4px solid #4a3a26; box-shadow: 4px 0 24px rgba(0,0,0,.5);
    transition: left .35s ease; overflow-y: auto; padding: 70px 20px 20px;
    font-family: Georgia, serif; color: #3a2f1f;
  }
  .qa-journal.open { left: 0; }
  .qa-journal h2 { font-size: 20px; border-bottom: 2px solid #8a7346; padding-bottom: 8px; }
  .qa-entry { border: 1px solid #b8a06e; border-radius: 6px; margin-bottom: 10px; background: rgba(255,255,255,.35); }
  .qa-entry summary {
    padding: 10px 12px; cursor: pointer; font-weight: bold; display: flex;
    align-items: center; gap: 8px; list-style: none;
  }
  .qa-entry summary::-webkit-details-marker { display: none; }
  .qa-entry .qa-num {
    width: 22px; height: 22px; border-radius: 50%; background: #4a3a26; color: #f3e6c8;
    display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;
  }
  .qa-entry .qa-check { margin-left: auto; color: #2f6f2f; font-weight: bold; }
  .qa-entry-body { padding: 0 12px 12px 42px; font-size: 13.5px; line-height: 1.6; }
  .qa-map-wrap {
    position: absolute; inset: 14px; border-radius: 4px; overflow: hidden;
    box-shadow: 0 0 0 6px #2a2018, 0 0 0 10px #8a7346, 0 0 0 12px #3a2a15,
                inset 0 0 90px rgba(20,12,4,.75), 0 20px 50px rgba(0,0,0,.6);
  }
  .qa-map-wrap .leaflet-tile-pane {
    filter: sepia(.6) saturate(1.5) contrast(1.15) brightness(.82) hue-rotate(-8deg);
  }
  .qa-marker-medallion {
    background: radial-gradient(circle at 35% 30%, #d9c28a, #7a5a2d 70%); color: #2a1f10;
    border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center;
    justify-content: center; font-weight: bold; font-size: 15px; font-family: Georgia, serif;
    border: 2px solid #3a2a15; box-shadow: 0 3px 8px rgba(0,0,0,.5);
  }
  .qa-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 2000;
    display: flex; align-items: center; justify-content: center;
  }
  .qa-modal {
    width: 320px; background: #f3e6c8; border: 4px double #7a5a2d; border-radius: 4px;
    padding: 18px; font-family: Georgia, serif; color: #3a2f1f; position: relative;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
  }
  .qa-modal img { width: 100%; border-radius: 4px; border: 2px solid #7a5a2d; margin: 8px 0; }
  .qa-modal .qa-close { position: absolute; top: 8px; right: 10px; cursor: pointer; font-weight: bold; color: #7a5a2d; }
</style>
</head>
<body>
<div id="app"></div>
<div id="run-banner">PROTOTYPE — full validation · query: &quot;Today I want to learn about plants&quot;</div>
<script>
const SPECIES = [
  {num:1,name:'Common Daisy',sci:'Bellis perennis',color:'#e41a1c',lat:40.413897,lon:-3.682498,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Bellis_perennis_sl1.jpg/330px-Bellis_perennis_sl1.jpg',desc:'Bellis perennis, commonly known as the common daisy, is a European flowering plant from the Asteraceae family. It is often considered the archetypal daisy species and is also known as the lawn daisy or English daisy.',points:[[40.414061, -3.685882], [40.4161, -3.686488], [40.413696, -3.683442], [40.41245, -3.687397], [40.41673, -3.682597], [40.417167, -3.686053], [40.414646, -3.6828], [40.415757, -3.685424], [40.418121, -3.686537], [40.408737, -3.684353], [40.418056, -3.685982], [40.418946, -3.679154], [40.418987, -3.686878], [40.415611, -3.684373], [40.416849, -3.682078], [40.417011, -3.685265], [40.410927, -3.685846], [40.419403, -3.686877], [40.415488, -3.685012], [40.410486, -3.687735], [40.416949, -3.686974], [40.412628, -3.681879], [40.41, -3.688211], [40.413192, -3.681895], [40.411706, -3.680792], [40.419376, -3.684033], [40.412942, -3.681344], [40.411911, -3.679765], [40.410605, -3.686645], [40.4146, -3.680061], [40.41002, -3.68787], [40.41558, -3.678742], [40.411873, -3.682123], [40.418507, -3.684359], [40.415035, -3.680601], [40.415258, -3.683466], [40.41383, -3.684496], [40.419059, -3.685909], [40.414505, -3.681747], [40.41016, -3.680088], [40.410976, -3.687202], [40.416962, -3.682453], [40.414772, -3.678646], [40.412994, -3.676617], [40.410472, -3.685603], [40.413446, -3.682606], [40.414276, -3.67968], [40.411946, -3.681551], [40.411834, -3.682574]]},
  {num:2,name:'Celandine',sci:'Chelidonium majus',color:'#377eb8',lat:40.4149848,lon:-3.6817906000000002,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Chelidonium_majus_-_K%C3%B6hler%E2%80%93s_Medizinal-Pflanzen-033.jpg/330px-Chelidonium_majus_-_K%C3%B6hler%E2%80%93s_Medizinal-Pflanzen-033.jpg',desc:'Chelidonium majus, the greater celandine, is a perennial herbaceous flowering plant belonging to the poppy family Papaveraceae. It is native to Europe and western Asia and has been widely introduced to North America.',points:[[40.414139, -3.68335], [40.413253, -3.683147], [40.417311, -3.68649], [40.41525, -3.681162], [40.415329, -3.681513], [40.413753, -3.683183], [40.415611, -3.684373], [40.416045, -3.678645], [40.414867, -3.682561], [40.412672, -3.683424], [40.4143, -3.684339], [40.416358, -3.688789], [40.416367, -3.688472], [40.412977, -3.685518], [40.413582, -3.685466], [40.412506, -3.684676], [40.412568, -3.68175], [40.4129, -3.687678], [40.413616, -3.681281], [40.413715, -3.687289], [40.413212, -3.685137], [40.414675, -3.68176], [40.414803, -3.681957], [40.414379, -3.680242], [40.417342, -3.682534]]},
  {num:3,name:'False Strawberry',sci:'Potentilla indica',color:'#4daf4a',lat:40.413491,lon:-3.678895666666667,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/2025-06-21_17_35_08_Mock_strawberry_along_Aquetong_Lane_in_the_Mountainview_section_of_Ewing_Township%2C_Mercer_County%2C_New_Jersey.jpg/330px-2025-06-21_17_35_08_Mock_strawberry_along_Aquetong_Lane_in_the_Mountainview_section_of_Ewing_Township%2C_Mercer_County%2C_New_Jersey.jpg',desc:'Potentilla indica, known as false strawberry or mock strawberry, is a flowering plant in the Rosaceae family native to West Asia, India, East Asia, and Southeast Asia. It resembles true strawberries with its aggregate fruit, but produces distinctive yellow flowers rather than white or pink ones. The species has naturalized widely worldwide and is considered invasive in the United States and Canada.',points:[[40.417083, -3.688658], [40.415611, -3.684373], [40.416045, -3.678645], [40.416051, -3.688473], [40.414758, -3.682015], [40.419668, -3.682877], [40.416061, -3.688156], [40.412302, -3.681358], [40.412568, -3.68175], [40.415258, -3.683466], [40.413132, -3.678562], [40.411827, -3.689068], [40.411038, -3.677506], [40.420086, -3.684802], [40.412275, -3.687697], [40.413095, -3.678534], [40.414246, -3.679591], [40.414467, -3.680337], [40.410983, -3.677694]]},
  {num:4,name:'Laurestine',sci:'Viburnum tinus',color:'#ff7f00',lat:40.41110966666667,lon:-3.6831180000000003,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Laurustinus_%28Viburnum_tinus%29_fruits_%2815726383257%29.jpg/330px-Laurustinus_%28Viburnum_tinus%29_fruits_%2815726383257%29.jpg',desc:'Viburnum tinus, also called laurustinus or laurustine, is a flowering plant in the Viburnaceae family. It is native to the Mediterranean region of Europe and North Africa.',points:[[40.411009, -3.683422], [40.412202, -3.6883], [40.413197, -3.686214], [40.411521, -3.68356], [40.410616, -3.677373], [40.411658, -3.681949], [40.411838, -3.681729], [40.411685, -3.681944], [40.411319, -3.682177], [40.409933, -3.686388], [40.411747, -3.678233], [40.410267, -3.686689], [40.411001, -3.683755], [40.408705, -3.681404], [40.408678, -3.681032], [40.415403, -3.681288], [40.409465, -3.688145]]},
  {num:5,name:'Naples garlic',sci:'Allium neapolitanum',color:'#984ea3',lat:40.413917,lon:-3.6851749999999996,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Allium_trifoliatum_pm.jpg/330px-Allium_trifoliatum_pm.jpg',desc:'Allium neapolitanum, commonly called Naples garlic, is a Mediterranean species of wild onion. It is native to France, Cyprus, Malta, Italy, Greece, Egypt, Turkey, Lebanon, Palestine, and Israel.',points:[[40.411729, -3.681424], [40.414241, -3.684778], [40.414356, -3.683656], [40.415087, -3.686262], [40.414313, -3.685545], [40.416045, -3.678645], [40.414214, -3.68429], [40.416358, -3.688789], [40.411591, -3.683837], [40.411957, -3.681361], [40.408732, -3.679259], [40.411678, -3.683063], [40.416492, -3.681042], [40.41605, -3.688472], [40.417727, -3.679498], [40.413197, -3.685202], [40.418427, -3.683717], [40.415761, -3.687519]]}
];
const NARRATIVE_INTRO = "We stand at the threshold of a modest meadow, where the gentle slope of the land beckons us forward into a tapestry of life both familiar and surprising. The air carries the sweet perfume of spring, and beneath our feet, the earth still holds the moisture of recent rains. Today, we shall embark on a journey through five remarkable botanical treasures, each waiting to reveal its secrets along this winding path through the Mediterranean countryside.";
const NARRATIVE_BY_SPECIES = ["Our walk begins at the very heart of the meadow, where we encounter the common daisy\u2014*Bellis perennis*\u2014that most archetypal of flowers. These humble white and yellow blooms, with their delicate petals arranged in perfect circles, have captivated human imagination for centuries, yet they remain endearingly simple, adorning lawns and wild grasses alike across Europe. Here, in their native habitat, they cluster together like tiny suns scattered across the green canvas, each one a testament to nature's elegant design.", "As we venture deeper, our path curves gently, and there before us emerges a rather more sinister character\u2014the greater celandine, *Chelidonium majus*, with its bright yellow flowers held aloft on slender stems. This perennial herbaceous plant, a member of the poppy family, has journeyed far from its native European and Asian origins, spreading across continents with determined purpose. Its distinctive appearance and potent sap have earned it respect and wariness in equal measure, a plant that commands attention despite its modest stature.", "Our journey now takes us to a curious imposter\u2014the false strawberry, *Potentilla indica*, whose bright yellow flowers seem almost to glow against the surrounding greenery. Native to the distant lands of West Asia and India, this Rosaceae family member has become a world traveler, spreading across continents until it has naturalized in wild places far from its ancestral home. Its deceptive resemblance to true strawberries serves as a reminder that nature often plays tricks on the unsuspecting observer, yet there is beauty in its mimicry and determination.", "As our path winds downward, we encounter a stalwart Mediterranean sentinel\u2014the laurestine, *Viburnum tinus*, its robust evergreen foliage and clusters of delicate pink-tinged flowers speaking of ancient Mediterranean shores. This flowering plant, native to the warm regions of southern Europe and North Africa, has adapted brilliantly to its native climate, yet here it flourishes as if transported to familiar ground. Its presence suggests the warmth that lingers in these protected valleys, a botanical ambassador of distant sunny lands.", "Our walk concludes at a fragrant treasure\u2014Naples garlic, *Allium neapolitanum*, whose delicate white star-like flowers cluster together in an almost ethereal display. This wild onion, native to the Mediterranean cradle spanning from France to the Levant, carries within it the essence of that ancient sea and its civilizations. As we stand before it, we recognize that our journey has traced not merely a path through space, but across the very geography of Mediterranean flora itself\u2014a botanical pilgrimage through the world's most storied botanical regions."];
const NOTES = [];
const CENTER = [40.41347989333333, -3.682295453333333];
const ROUTE_COORDS = SPECIES.map(s => [s.lat, s.lon]);

function openQuestModal(i) {
  const s = SPECIES[i];
  const backdrop = document.createElement('div');
  backdrop.className = 'qa-modal-backdrop';
  backdrop.innerHTML = `
    <div class="qa-modal">
      <span class="qa-close">✕</span>
      <div style="font-size:11px;letter-spacing:1px;color:#7a5a2d">QUEST ENTRY ${s.num}/${SPECIES.length}</div>
      <h3 style="margin:4px 0 0">${s.name}</h3>
      <div style="font-style:italic;color:#7a5a2d;font-size:12px">${s.sci}</div>
      ${s.img ? `<img src="${s.img}"/>` : ''}
      <p style="font-size:13px;line-height:1.5">${s.desc}</p>
      <p style="font-size:11px;color:#7a5a2d;margin-top:10px">${s.points.length} recorded observations — see the small dots on the map for the full spread.</p>
    </div>
  `;
  backdrop.querySelector('.qa-close').onclick = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
  document.body.appendChild(backdrop);
}

function render() {
  const container = document.getElementById('app');
  container.innerHTML = `
    <div class="qa-root">
      <div class="qa-titlebar">⚔ A Nature Quest</div>
      ${NOTES.length ? `<div class="qa-notes">${NOTES.map(n => `<div>${n}</div>`).join('')}</div>` : ''}
      <div class="qa-journal-tab" id="qa-tab">QUEST LOG</div>
      <div class="qa-journal" id="qa-journal">
        <h2>Quest Log</h2>
        <p style="font-size:13px;line-height:1.6;margin-bottom:16px">${NARRATIVE_INTRO}</p>
        ${SPECIES.map((s, i) => `
          <details class="qa-entry" data-idx="${i}">
            <summary><span class="qa-num">${s.num}</span> ${s.name}</summary>
            <div class="qa-entry-body">${NARRATIVE_BY_SPECIES[i]}</div>
          </details>
        `).join('')}
      </div>
      <div class="qa-map-wrap">
        <div id="qa-map" class="map-fill"></div>
      </div>
    </div>
  `;
  document.getElementById('qa-tab').onclick = () => document.getElementById('qa-journal').classList.toggle('open');

  const map = L.map('qa-map').setView(CENTER, 15);
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap (CC-BY-SA)',
    maxZoom: 17
  }).addTo(map);
  L.polyline(ROUTE_COORDS, { color: '#333', weight: 2.5, opacity: 0.55, dashArray: '8,7' }).addTo(map);

  let openDetail = null;
  SPECIES.forEach((s, i) => {
    // Raw occurrence points for this species — built but not added to the
    // map until this species' marker is clicked (shows the full recorded
    // spread behind the single hotspot marker, not just the cluster itself).
    const detailLayer = L.layerGroup();
    s.points.forEach(p => {
      L.circleMarker(p, { radius: 3, color: s.color, weight: 1, fillColor: s.color, fillOpacity: 0.7 }).addTo(detailLayer);
    });

    const icon = L.divIcon({ html: `<div class="qa-marker-medallion">${s.num}</div>`, iconSize: [36, 36], iconAnchor: [18, 18], className: '' });
    L.marker([s.lat, s.lon], { icon }).addTo(map).on('click', () => {
      if (openDetail === detailLayer) {
        map.removeLayer(detailLayer);
        openDetail = null;
      } else {
        if (openDetail) map.removeLayer(openDetail);
        detailLayer.addTo(map);
        openDetail = detailLayer;
      }
      openQuestModal(i);
    });
  });
}

render();
</script>
</body>
</html>
