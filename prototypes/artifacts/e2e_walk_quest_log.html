<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PROTOTYPE — e2e walk spike (adventure-style quest log)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  .map-fill { position: absolute; inset: 0; }
  .map-noise {
    position: absolute; inset: 0; pointer-events: none; z-index: 450;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.35"/></svg>');
  }
  #run-banner {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5000;
    background: #111; color: #ffd700; padding: 6px 14px; border-radius: 999px;
    font-size: 11px; font-family: monospace; border: 2px solid #ffd700; max-width: 80vw;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .qa-root { position: absolute; inset: 0; background: #1b1f18; }
  .qa-titlebar {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: linear-gradient(#3a2f22, #2a2118); color: #e8d9b5; padding: 8px 24px;
    border: 2px solid #8a7346; border-radius: 6px; font-family: Georgia, serif;
    font-size: 16px; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  .qa-journal-tab {
    position: absolute; top: 90px; left: 0; z-index: 1000; background: #4a3a26;
    color: #e8d9b5; padding: 14px 8px; border-radius: 0 8px 8px 0; cursor: pointer;
    font-family: Georgia, serif; writing-mode: vertical-rl; border: 2px solid #8a7346;
    border-left: none; box-shadow: 3px 3px 10px rgba(0,0,0,.4); font-size: 13px;
  }
  .qa-journal {
    position: absolute; top: 0; left: -380px; width: 380px; height: 100%; z-index: 999;
    background: #f3e6c8 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4"><rect width="4" height="4" fill="%23f3e6c8"/><circle cx="1" cy="1" r=".4" fill="%23e3d3ab"/></svg>');
    border-right: 4px solid #4a3a26; box-shadow: 4px 0 24px rgba(0,0,0,.5);
    transition: left .35s ease; overflow-y: auto; padding: 70px 20px 20px;
    font-family: Georgia, serif; color: #3a2f1f;
  }
  .qa-journal.open { left: 0; }
  .qa-journal h2 { font-size: 20px; border-bottom: 2px solid #8a7346; padding-bottom: 8px; }
  .qa-entry { border: 1px solid #b8a06e; border-radius: 6px; margin-bottom: 10px; background: rgba(255,255,255,.35); }
  .qa-entry summary {
    padding: 10px 12px; cursor: pointer; font-weight: bold; display: flex;
    align-items: center; gap: 8px; list-style: none;
  }
  .qa-entry summary::-webkit-details-marker { display: none; }
  .qa-entry .qa-num {
    width: 22px; height: 22px; border-radius: 50%; background: #4a3a26; color: #f3e6c8;
    display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;
  }
  .qa-entry .qa-check { margin-left: auto; color: #2f6f2f; font-weight: bold; }
  .qa-entry-body { padding: 0 12px 12px 42px; font-size: 13.5px; line-height: 1.6; }
  .qa-map-wrap {
    position: absolute; inset: 14px; border-radius: 4px; overflow: hidden;
    box-shadow: 0 0 0 6px #2a2018, 0 0 0 10px #8a7346, 0 0 0 12px #3a2a15,
                inset 0 0 90px rgba(20,12,4,.75), 0 20px 50px rgba(0,0,0,.6);
  }
  .qa-map-wrap .leaflet-tile-pane {
    filter: sepia(.6) saturate(1.5) contrast(1.15) brightness(.82) hue-rotate(-8deg);
  }
  .qa-map-vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 460;
    background: radial-gradient(ellipse at center, rgba(58,42,21,0) 45%, rgba(30,20,8,.75) 100%);
    mix-blend-mode: multiply;
  }
  .qa-map-grain { mix-blend-mode: overlay; opacity: .5; }
  .qa-marker-medallion {
    background: radial-gradient(circle at 35% 30%, #d9c28a, #7a5a2d 70%); color: #2a1f10;
    border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center;
    justify-content: center; font-weight: bold; font-size: 15px; font-family: Georgia, serif;
    border: 2px solid #3a2a15; box-shadow: 0 3px 8px rgba(0,0,0,.5);
  }
  .qa-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 2000;
    display: flex; align-items: center; justify-content: center;
  }
  .qa-modal {
    width: 320px; background: #f3e6c8; border: 4px double #7a5a2d; border-radius: 4px;
    padding: 18px; font-family: Georgia, serif; color: #3a2f1f; position: relative;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
  }
  .qa-modal img { width: 100%; border-radius: 4px; border: 2px solid #7a5a2d; margin: 8px 0; }
  .qa-modal .qa-close { position: absolute; top: 8px; right: 10px; cursor: pointer; font-weight: bold; color: #7a5a2d; }
  .qa-modal button.qa-discover {
    margin-top: 10px; width: 100%; padding: 8px; background: #4a3a26; color: #f3e6c8;
    border: none; border-radius: 4px; cursor: pointer; font-family: Georgia, serif;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="run-banner">PROTOTYPE — e2e walk spike · query: &quot;Today I want to learn about plants&quot;</div>
<script>
const SPECIES = [
  {num:1,name:'False Strawberry',sci:'Potentilla indica',color:'#e41a1c',lat:40.41455547368421,lon:-3.682819052631579,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/2025-06-21_17_35_08_Mock_strawberry_along_Aquetong_Lane_in_the_Mountainview_section_of_Ewing_Township%2C_Mercer_County%2C_New_Jersey.jpg/330px-2025-06-21_17_35_08_Mock_strawberry_along_Aquetong_Lane_in_the_Mountainview_section_of_Ewing_Township%2C_Mercer_County%2C_New_Jersey.jpg',desc:'False strawberry is a flowering plant in the Rosaceae family, native to West Asia, India, East Asia, and Southeast Asia. It produces yellow flowers and an aggregate fruit similar to true strawberries, but with distinctive three-part leaves. The plant has naturalized in many regions worldwide and is considered an invasive species in the United States and Canada, where it commonly appears as a lawn weed.'},
  {num:2,name:'Common Daisy',sci:'Bellis perennis',color:'#377eb8',lat:40.41451076,lon:-3.6835868599999997,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Bellis_perennis_sl1.jpg/330px-Bellis_perennis_sl1.jpg',desc:'Common daisy is a European flowering plant in the Asteraceae family, often considered the typical example of what people call a daisy. It is sometimes called lawn daisy or English daisy to distinguish it from other plants that share the daisy name.'},
  {num:3,name:'Celandine',sci:'Chelidonium majus',color:'#4daf4a',lat:40.414297423076924,lon:-3.684007653846154,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Chelidonium_majus_-_K%C3%B6hler%E2%80%93s_Medizinal-Pflanzen-033.jpg/330px-Chelidonium_majus_-_K%C3%B6hler%E2%80%93s_Medizinal-Pflanzen-033.jpg',desc:'Greater celandine is a perennial herbaceous flowering plant belonging to the poppy family Papaveraceae. Native to Europe and western Asia, it has been widely introduced to North America and is one of two species in the genus Chelidonium.'},
  {num:4,name:'Naples garlic',sci:'Allium neapolitanum',color:'#ff7f00',lat:40.414142684210525,lon:-3.683974736842105,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Allium_trifoliatum_pm.jpg/330px-Allium_trifoliatum_pm.jpg',desc:'Naples garlic is a Mediterranean species of wild onion in the genus Allium. It is native to a range of Mediterranean countries including France, Italy, Greece, Turkey, Lebanon, Egypt, Palestine, and Israel.'},
  {num:5,name:'Laurestine',sci:'Viburnum tinus',color:'#984ea3',lat:40.41174755555556,lon:-3.6829985555555558,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Laurustinus_%28Viburnum_tinus%29_fruits_%2815726383257%29.jpg/330px-Laurustinus_%28Viburnum_tinus%29_fruits_%2815726383257%29.jpg',desc:'Laurestine is a flowering plant in the Viburnaceae family, native to the Mediterranean region of Europe and North Africa. It is a species of Viburnum recognized by its distinctive appearance and Mediterranean habitat.'}
];
const NARRATIVE_INTRO = "We venture now into the verdant heart of Retiro Park, where Madrid's urban landscape gives way to a tapestry of botanical wonders. Here, beneath the Spanish sun, plants from distant lands have found refuge and flourished, creating a living museum of global flora. Our journey will take us through five remarkable species, each a testament to nature's boundless capacity for adaptation and survival.";
const NARRATIVE_BY_SPECIES = ["Our first discovery awaits at the edge of a sun-dappled clearing: the False Strawberry, a deceptive little plant with distinctive three-part leaves and cheerful yellow flowers. Native to the distant lands of West Asia and India, this wily invader has journeyed across the globe, establishing itself in parks and gardens wherever it finds purchase. Though it produces an aggregate fruit that mimics the true strawberry, this impostor remains a testament to nature's remarkable mimicry and the wandering nature of seeds on the wind.", "Just steps along our path, we encounter a humble treasure: the Common Daisy, that most iconic of all daisies, with its delicate white petals and golden center. This European native, sometimes called the English Daisy, represents the very essence of what people imagine when they think of a daisy\u2014a simple, elegant flower that has charmed meadows and lawns for generations. Here in Retiro Park, it persists as a gentle reminder of the wild beauty that thrives even in cultivated spaces.", "As we venture deeper, a more striking figure emerges from the undergrowth: the Greater Celandine, a perennial bearing the ancient lineage of the poppy family. Its bright yellow flowers and distinctive divided leaves mark it as a native of Europe and western Asia, yet it has travelled far beyond its homeland to establish itself across the continents. This resilient wanderer, with its caustic sap and stubborn determination, embodies the spirit of those plants that refuse to remain confined to their native shores.", "Our path now leads us to a delicate cluster of star-shaped white flowers: Naples Garlic, a wild onion descended from the sun-baked Mediterranean coasts. Native to the cradle of Mediterranean civilization\u2014from the Grecian isles to the Lebanese highlands\u2014this elegant Allium brings a whisper of the ancient world to Madrid's modern park. Though modest in appearance, it carries within it the essence of the Mediterranean, a fragrant ghost of countries and cultures across a storied sea.", "At last, our journey culminates at a handsome evergreen shrub adorned with small white flowers: the Laurestine, a noble native of the Mediterranean region and North Africa. This striking member of the Viburnaceae family, with its distinctive appearance and Mediterranean pedigree, stands as a living bridge between Madrid and the ancient lands of the Mediterranean basin. As we conclude our walk, we are reminded that Retiro Park is not merely a garden of Madrid, but a sanctuary where the world's botanical treasures converge in peaceful coexistence."];
const CENTER = [40.41385077930544, -3.6834773717750786];
const ROUTE_COORDS = SPECIES.map(s => [s.lat, s.lon]);

function baseTileLayer(map) {
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap (CC-BY-SA)',
    maxZoom: 17
  }).addTo(map);
  L.polyline(ROUTE_COORDS, { color: '#333', weight: 2.5, opacity: 0.55, dashArray: '8,7' }).addTo(map);
}

function openQuestModal(i) {
  const s = SPECIES[i];
  const backdrop = document.createElement('div');
  backdrop.className = 'qa-modal-backdrop';
  backdrop.innerHTML = `
    <div class="qa-modal">
      <span class="qa-close">✕</span>
      <div style="font-size:11px;letter-spacing:1px;color:#7a5a2d">QUEST ENTRY ${s.num}/${SPECIES.length}</div>
      <h3 style="margin:4px 0 0">${s.name}</h3>
      <div style="font-style:italic;color:#7a5a2d;font-size:12px">${s.sci}</div>
      ${s.img ? `<img src="${s.img}"/>` : ''}
      <p style="font-size:13px;line-height:1.5">${s.desc}</p>
      <button class="qa-discover">Mark Discovered</button>
    </div>
  `;
  backdrop.querySelector('.qa-close').onclick = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
  backdrop.querySelector('.qa-discover').onclick = () => {
    const chk = document.querySelector(`[data-check="${i}"]`);
    if (chk) chk.style.visibility = 'visible';
    backdrop.remove();
  };
  document.body.appendChild(backdrop);
}

function render() {
  const container = document.getElementById('app');
  container.innerHTML = `
    <div class="qa-root">
      <div class="qa-titlebar">⚔ Retiro Park — A Nature Quest</div>
      <div class="qa-journal-tab" id="qa-tab">QUEST LOG</div>
      <div class="qa-journal" id="qa-journal">
        <h2>Quest Log</h2>
        <p style="font-size:13px;line-height:1.6;margin-bottom:16px">${NARRATIVE_INTRO}</p>
        ${SPECIES.map((s, i) => `
          <details class="qa-entry" data-idx="${i}">
            <summary><span class="qa-num">${s.num}</span> ${s.name} <span class="qa-check" data-check="${i}" style="visibility:hidden">✓</span></summary>
            <div class="qa-entry-body">${NARRATIVE_BY_SPECIES[i]}</div>
          </details>
        `).join('')}
      </div>
      <div class="qa-map-wrap">
        <div id="qa-map" class="map-fill"></div>
        <div class="map-noise qa-map-grain"></div>
        <div class="qa-map-vignette"></div>
      </div>
    </div>
  `;
  document.getElementById('qa-tab').onclick = () => document.getElementById('qa-journal').classList.toggle('open');

  const map = L.map('qa-map').setView(CENTER, 15);
  baseTileLayer(map);
  SPECIES.forEach((s, i) => {
    const icon = L.divIcon({ html: `<div class="qa-marker-medallion">${s.num}</div>`, iconSize: [36, 36], iconAnchor: [18, 18], className: '' });
    L.marker([s.lat, s.lon], { icon }).addTo(map).on('click', () => openQuestModal(i));
  });
}

render();
</script>
</body>
</html>
