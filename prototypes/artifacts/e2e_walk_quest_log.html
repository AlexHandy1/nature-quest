<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PROTOTYPE — e2e walk spike (adventure-style quest log)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  .map-fill { position: absolute; inset: 0; }
  .map-noise {
    position: absolute; inset: 0; pointer-events: none; z-index: 450;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.35"/></svg>');
  }
  #run-banner {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5000;
    background: #111; color: #ffd700; padding: 6px 14px; border-radius: 999px;
    font-size: 11px; font-family: monospace; border: 2px solid #ffd700; max-width: 80vw;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .qa-root { position: absolute; inset: 0; background: #1b1f18; }
  .qa-titlebar {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: linear-gradient(#3a2f22, #2a2118); color: #e8d9b5; padding: 8px 24px;
    border: 2px solid #8a7346; border-radius: 6px; font-family: Georgia, serif;
    font-size: 16px; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  .qa-journal-tab {
    position: absolute; top: 90px; left: 0; z-index: 1000; background: #4a3a26;
    color: #e8d9b5; padding: 14px 8px; border-radius: 0 8px 8px 0; cursor: pointer;
    font-family: Georgia, serif; writing-mode: vertical-rl; border: 2px solid #8a7346;
    border-left: none; box-shadow: 3px 3px 10px rgba(0,0,0,.4); font-size: 13px;
  }
  .qa-journal {
    position: absolute; top: 0; left: -380px; width: 380px; height: 100%; z-index: 999;
    background: #f3e6c8 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4"><rect width="4" height="4" fill="%23f3e6c8"/><circle cx="1" cy="1" r=".4" fill="%23e3d3ab"/></svg>');
    border-right: 4px solid #4a3a26; box-shadow: 4px 0 24px rgba(0,0,0,.5);
    transition: left .35s ease; overflow-y: auto; padding: 70px 20px 20px;
    font-family: Georgia, serif; color: #3a2f1f;
  }
  .qa-journal.open { left: 0; }
  .qa-journal h2 { font-size: 20px; border-bottom: 2px solid #8a7346; padding-bottom: 8px; }
  .qa-entry { border: 1px solid #b8a06e; border-radius: 6px; margin-bottom: 10px; background: rgba(255,255,255,.35); }
  .qa-entry summary {
    padding: 10px 12px; cursor: pointer; font-weight: bold; display: flex;
    align-items: center; gap: 8px; list-style: none;
  }
  .qa-entry summary::-webkit-details-marker { display: none; }
  .qa-entry .qa-num {
    width: 22px; height: 22px; border-radius: 50%; background: #4a3a26; color: #f3e6c8;
    display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;
  }
  .qa-entry .qa-check { margin-left: auto; color: #2f6f2f; font-weight: bold; }
  .qa-entry-body { padding: 0 12px 12px 42px; font-size: 13.5px; line-height: 1.6; }
  .qa-map-wrap {
    position: absolute; inset: 14px; border-radius: 4px; overflow: hidden;
    box-shadow: 0 0 0 6px #2a2018, 0 0 0 10px #8a7346, 0 0 0 12px #3a2a15,
                inset 0 0 90px rgba(20,12,4,.75), 0 20px 50px rgba(0,0,0,.6);
  }
  .qa-map-wrap .leaflet-tile-pane {
    filter: sepia(.6) saturate(1.5) contrast(1.15) brightness(.82) hue-rotate(-8deg);
  }
  .qa-map-vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 460;
    background: radial-gradient(ellipse at center, rgba(58,42,21,0) 45%, rgba(30,20,8,.75) 100%);
    mix-blend-mode: multiply;
  }
  .qa-map-grain { mix-blend-mode: overlay; opacity: .5; }
  .qa-marker-medallion {
    background: radial-gradient(circle at 35% 30%, #d9c28a, #7a5a2d 70%); color: #2a1f10;
    border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center;
    justify-content: center; font-weight: bold; font-size: 15px; font-family: Georgia, serif;
    border: 2px solid #3a2a15; box-shadow: 0 3px 8px rgba(0,0,0,.5);
  }
  .qa-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 2000;
    display: flex; align-items: center; justify-content: center;
  }
  .qa-modal {
    width: 320px; background: #f3e6c8; border: 4px double #7a5a2d; border-radius: 4px;
    padding: 18px; font-family: Georgia, serif; color: #3a2f1f; position: relative;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
  }
  .qa-modal img { width: 100%; border-radius: 4px; border: 2px solid #7a5a2d; margin: 8px 0; }
  .qa-modal .qa-close { position: absolute; top: 8px; right: 10px; cursor: pointer; font-weight: bold; color: #7a5a2d; }
  .qa-modal button.qa-discover {
    margin-top: 10px; width: 100%; padding: 8px; background: #4a3a26; color: #f3e6c8;
    border: none; border-radius: 4px; cursor: pointer; font-family: Georgia, serif;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="run-banner">PROTOTYPE — e2e walk spike · query: &quot;Show me mammals (like cows) and birds&quot;</div>
<script>
const SPECIES = [
  {num:1,name:'Acorn Jay',sci:'Garrulus glandarius',color:'#e41a1c',lat:40.879290857142855,lon:-3.8789658571428567,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Garrulus_glandarius_1_Luc_Viatour.jpg/330px-Garrulus_glandarius_1_Luc_Viatour.jpg',desc:'The Eurasian jay is a passerine bird in the crow family with pinkish brown plumage, a black stripe on each side of its whitish throat, a bright blue panel on the upper wing, and a black tail. It is a woodland bird found across a vast region from western Europe and north-west Africa to the Indian subcontinent and south-east Asia. Several distinct racial forms have evolved across its range, with notable differences between populations at the extremes.'},
  {num:2,name:'Continental Robin',sci:'Erithacus rubecula',color:'#377eb8',lat:40.87784033333333,lon:-3.8778063333333335,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Erithacus_rubecula_with_cocked_head.jpg/330px-Erithacus_rubecula_with_cocked_head.jpg',desc:'The European robin is a small insectivorous passerine bird belonging to the Old World flycatcher family. It is found across Europe, from Western Siberia in the east to North Africa in the south. The species is sedentary in western and southern parts of its range, but migratory in the north and east where winters are harsher.'},
  {num:3,name:'Brown-breasted Hedgehog',sci:'Erinaceus europaeus',color:'#4daf4a',lat:40.881084,lon:-3.88546,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Erinaceus_europaeus_LC0119.jpg/330px-Erinaceus_europaeus_LC0119.jpg',desc:'The European hedgehog is a hedgehog species native to Europe, from Iberia and Italy northwards into Scandinavia and westwards into Ireland. It is a common and widely distributed species capable of surviving across many different habitat types. The species is well-known and popular in European gardens for its appearance and its appetite for garden pests, though populations are declining severely in Great Britain.'},
  {num:4,name:'Boar',sci:'Sus scrofa',color:'#ff7f00',lat:40.881084,lon:-3.88546,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Wildschwein%2C_N%C3%A4he_Pulverstampftor_%28cropped%29.jpg/330px-Wildschwein%2C_N%C3%A4he_Pulverstampftor_%28cropped%29.jpg',desc:'The wild boar is a suid native to much of Eurasia and North Africa, and has been introduced to the Americas and Oceania. It is now one of the widest-ranging and most widespread mammals in the world, with high numbers and adaptability to diverse habitats. The species probably originated in Southeast Asia during the Early Pleistocene and spread throughout the Old World, outcompeting other suid species.'},
  {num:5,name:'Aurochs',sci:'Bos taurus',color:'#984ea3',lat:40.881084,lon:-3.88546,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Copenhagen_Aurochse.jpg/330px-Copenhagen_Aurochse.jpg',desc:'The aurochs is an extinct species of bovine that is considered the wild ancestor of modern domestic cattle. Bulls had a shoulder height of up to 1.8 meters and cows up to 1.55 meters, making it one of the largest herbivores of the Holocene. It possessed massive, elongated, and broad horns that reached 80 centimeters in length.'}
];
const NARRATIVE_INTRO = "We find ourselves at the threshold of Retiro Park on this crisp Madrid morning, where centuries of cultivation have created a sanctuary where nature and civilization exist in delicate harmony. The ancient trees tower above us, their branches forming a cathedral of green, and already we can hear the distant calls of woodland creatures stirring in the dappled light. Today, we embark on a journey through five remarkable encounters\u2014a pilgrimage through the park's hidden networks of life, where each waypoint promises a new revelation.";
const NARRATIVE_BY_SPECIES = ["Our first encounter arrives with a flash of brilliant blue\u2014the Eurasian jay, a striking passerine of the crow family, perches boldly among the upper branches at our first waypoint. Its pinkish-brown plumage and distinctive black stripe framing a whitish throat mark it as a true woodland aristocrat, a species that has journeyed across vast continents from western Europe to the distant Indian subcontinent. Here in Retiro, this intelligent bird serves as both sentinel and architect, its acorn-caching habits subtly shaping the very forest that sustains it.", "As we venture deeper along the winding paths, a smaller form catches our eye\u2014the European robin, that beloved red-breasted insectivore whose presence signals we have entered truly settled woodland. This ancient songbird, familiar to countless generations across Europe, pauses on a low perch and regards us with an almost knowing curiosity, its dark eyes bright with intelligence. Though many of its northern cousins must migrate when winter's grip tightens, here in temperate Madrid this small flycatcher claims permanent residence, a constant companion to all who walk these grounds.", "Our path now descends toward shadowed undergrowth, and we must tread carefully\u2014for here dwells the European hedgehog, that endearing nocturnal wanderer with its coat of thousands of spines. This humble creature, native to Iberia and ranging northward into the Scandinavian reaches, is nature's tireless pest controller, yet its populations face mounting pressures across the continent. In Madrid's gardens and wild spaces, it remains a symbol of resilience, a small armored wanderer still clinging to its ancestral territories.", "Our footsteps now grow cautious, for we have entered the domain of the wild boar\u2014that ancient suid whose ancestors emerged in Southeast Asia millions of years ago and spread their mastery across the entire Old World. The evidence of their presence surrounds us: churned earth and overturned soil where these powerful omnivores have rooted and foraged with remarkable adaptability. From their humble origins to their current status as one of Earth's most widespread mammals, the boar stands as a testament to nature's capacity for explosive success.", "Our journey culminates at a poignant waypoint where we pause to contemplate a creature that walks these grounds now only in imagination\u2014the magnificent aurochs, that colossal ancestor of domestic cattle, extinct for nearly four centuries. Standing nearly six feet at the shoulder, with horns that stretched an astonishing eighty centimeters, this Holocene giant once dominated European landscapes before human expansion claimed its final representatives. Here in Retiro, we honor its memory and reflect upon our role as stewards of the extraordinary wildlife that still shares this world with us."];
const CENTER = [40.88007663809524, -3.882630438095238];
const ROUTE_COORDS = SPECIES.map(s => [s.lat, s.lon]);

function baseTileLayer(map) {
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap (CC-BY-SA)',
    maxZoom: 17
  }).addTo(map);
  L.polyline(ROUTE_COORDS, { color: '#333', weight: 2.5, opacity: 0.55, dashArray: '8,7' }).addTo(map);
}

function openQuestModal(i) {
  const s = SPECIES[i];
  const backdrop = document.createElement('div');
  backdrop.className = 'qa-modal-backdrop';
  backdrop.innerHTML = `
    <div class="qa-modal">
      <span class="qa-close">✕</span>
      <div style="font-size:11px;letter-spacing:1px;color:#7a5a2d">QUEST ENTRY ${s.num}/${SPECIES.length}</div>
      <h3 style="margin:4px 0 0">${s.name}</h3>
      <div style="font-style:italic;color:#7a5a2d;font-size:12px">${s.sci}</div>
      ${s.img ? `<img src="${s.img}"/>` : ''}
      <p style="font-size:13px;line-height:1.5">${s.desc}</p>
      <button class="qa-discover">Mark Discovered</button>
    </div>
  `;
  backdrop.querySelector('.qa-close').onclick = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
  backdrop.querySelector('.qa-discover').onclick = () => {
    const chk = document.querySelector(`[data-check="${i}"]`);
    if (chk) chk.style.visibility = 'visible';
    backdrop.remove();
  };
  document.body.appendChild(backdrop);
}

function render() {
  const container = document.getElementById('app');
  container.innerHTML = `
    <div class="qa-root">
      <div class="qa-titlebar">⚔ Retiro Park — A Nature Quest</div>
      <div class="qa-journal-tab" id="qa-tab">QUEST LOG</div>
      <div class="qa-journal" id="qa-journal">
        <h2>Quest Log</h2>
        <p style="font-size:13px;line-height:1.6;margin-bottom:16px">${NARRATIVE_INTRO}</p>
        ${SPECIES.map((s, i) => `
          <details class="qa-entry" data-idx="${i}">
            <summary><span class="qa-num">${s.num}</span> ${s.name} <span class="qa-check" data-check="${i}" style="visibility:hidden">✓</span></summary>
            <div class="qa-entry-body">${NARRATIVE_BY_SPECIES[i]}</div>
          </details>
        `).join('')}
      </div>
      <div class="qa-map-wrap">
        <div id="qa-map" class="map-fill"></div>
        <div class="map-noise qa-map-grain"></div>
        <div class="qa-map-vignette"></div>
      </div>
    </div>
  `;
  document.getElementById('qa-tab').onclick = () => document.getElementById('qa-journal').classList.toggle('open');

  const map = L.map('qa-map').setView(CENTER, 15);
  baseTileLayer(map);
  SPECIES.forEach((s, i) => {
    const icon = L.divIcon({ html: `<div class="qa-marker-medallion">${s.num}</div>`, iconSize: [36, 36], iconAnchor: [18, 18], className: '' });
    L.marker([s.lat, s.lon], { icon }).addTo(map).on('click', () => openQuestModal(i));
  });
}

render();
</script>
</body>
</html>
