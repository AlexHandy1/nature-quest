<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PROTOTYPE — e2e walk spike (Zelda quest log)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  .map-fill { position: absolute; inset: 0; }
  .map-noise {
    position: absolute; inset: 0; pointer-events: none; z-index: 450;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.35"/></svg>');
  }
  #run-banner {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5000;
    background: #111; color: #ffd700; padding: 6px 14px; border-radius: 999px;
    font-size: 11px; font-family: monospace; border: 2px solid #ffd700; max-width: 80vw;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .qa-root { position: absolute; inset: 0; background: #1b1f18; }
  .qa-titlebar {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: linear-gradient(#3a2f22, #2a2118); color: #e8d9b5; padding: 8px 24px;
    border: 2px solid #8a7346; border-radius: 6px; font-family: Georgia, serif;
    font-size: 16px; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  .qa-journal-tab {
    position: absolute; top: 90px; left: 0; z-index: 1000; background: #4a3a26;
    color: #e8d9b5; padding: 14px 8px; border-radius: 0 8px 8px 0; cursor: pointer;
    font-family: Georgia, serif; writing-mode: vertical-rl; border: 2px solid #8a7346;
    border-left: none; box-shadow: 3px 3px 10px rgba(0,0,0,.4); font-size: 13px;
  }
  .qa-journal {
    position: absolute; top: 0; left: -380px; width: 380px; height: 100%; z-index: 999;
    background: #f3e6c8 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4"><rect width="4" height="4" fill="%23f3e6c8"/><circle cx="1" cy="1" r=".4" fill="%23e3d3ab"/></svg>');
    border-right: 4px solid #4a3a26; box-shadow: 4px 0 24px rgba(0,0,0,.5);
    transition: left .35s ease; overflow-y: auto; padding: 70px 20px 20px;
    font-family: Georgia, serif; color: #3a2f1f;
  }
  .qa-journal.open { left: 0; }
  .qa-journal h2 { font-size: 20px; border-bottom: 2px solid #8a7346; padding-bottom: 8px; }
  .qa-entry { border: 1px solid #b8a06e; border-radius: 6px; margin-bottom: 10px; background: rgba(255,255,255,.35); }
  .qa-entry summary {
    padding: 10px 12px; cursor: pointer; font-weight: bold; display: flex;
    align-items: center; gap: 8px; list-style: none;
  }
  .qa-entry summary::-webkit-details-marker { display: none; }
  .qa-entry .qa-num {
    width: 22px; height: 22px; border-radius: 50%; background: #4a3a26; color: #f3e6c8;
    display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;
  }
  .qa-entry .qa-check { margin-left: auto; color: #2f6f2f; font-weight: bold; }
  .qa-entry-body { padding: 0 12px 12px 42px; font-size: 13.5px; line-height: 1.6; }
  .qa-map-wrap {
    position: absolute; inset: 14px; border-radius: 4px; overflow: hidden;
    box-shadow: 0 0 0 6px #2a2018, 0 0 0 10px #8a7346, 0 0 0 12px #3a2a15,
                inset 0 0 90px rgba(20,12,4,.75), 0 20px 50px rgba(0,0,0,.6);
  }
  .qa-map-wrap .leaflet-tile-pane {
    filter: sepia(.6) saturate(1.5) contrast(1.15) brightness(.82) hue-rotate(-8deg);
  }
  .qa-map-vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 460;
    background: radial-gradient(ellipse at center, rgba(58,42,21,0) 45%, rgba(30,20,8,.75) 100%);
    mix-blend-mode: multiply;
  }
  .qa-map-grain { mix-blend-mode: overlay; opacity: .5; }
  .qa-marker-medallion {
    background: radial-gradient(circle at 35% 30%, #d9c28a, #7a5a2d 70%); color: #2a1f10;
    border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center;
    justify-content: center; font-weight: bold; font-size: 15px; font-family: Georgia, serif;
    border: 2px solid #3a2a15; box-shadow: 0 3px 8px rgba(0,0,0,.5);
  }
  .qa-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 2000;
    display: flex; align-items: center; justify-content: center;
  }
  .qa-modal {
    width: 320px; background: #f3e6c8; border: 4px double #7a5a2d; border-radius: 4px;
    padding: 18px; font-family: Georgia, serif; color: #3a2f1f; position: relative;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
  }
  .qa-modal img { width: 100%; border-radius: 4px; border: 2px solid #7a5a2d; margin: 8px 0; }
  .qa-modal .qa-close { position: absolute; top: 8px; right: 10px; cursor: pointer; font-weight: bold; color: #7a5a2d; }
  .qa-modal button.qa-discover {
    margin-top: 10px; width: 100%; padding: 8px; background: #4a3a26; color: #f3e6c8;
    border: none; border-radius: 4px; cursor: pointer; font-family: Georgia, serif;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="run-banner">PROTOTYPE — e2e walk spike · query: &quot;Show me a mix of birds, plants and mammals&quot;</div>
<script>
const SPECIES = [
  {num:1,name:'Common Daisy',sci:'Bellis perennis',color:'#e41a1c',lat:40.415718125,lon:-3.684487125,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Bellis_perennis_sl1.jpg/330px-Bellis_perennis_sl1.jpg',desc:'Bellis perennis, commonly known as the common daisy, is a European plant belonging to the Asteraceae family. It is often considered the typical species that gives the daisy its name. To distinguish it from other plants called daisies, it may also be referred to as the lawn daisy or English daisy.'},
  {num:2,name:'Black-billed Magpie',sci:'Pica pica',color:'#377eb8',lat:40.414847925925926,lon:-3.684565037037037,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/BlackBilledMagpie.jpg/330px-BlackBilledMagpie.jpg',desc:'The black-billed magpie, also called the American magpie, is a corvid family bird found in western North America. It has black and white plumage, with wings and tail displaying black areas and iridescent hints of blue and blue-green. Once classified as a subspecies of Pica pica, it was recognized as a separate species in 2000 based on genetic research.'},
  {num:3,name:'Naples garlic',sci:'Allium neapolitanum',color:'#4daf4a',lat:40.41385325,lon:-3.68403,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Allium_trifoliatum_pm.jpg/330px-Allium_trifoliatum_pm.jpg',desc:'Allium trifoliatum, commonly called pink garlic or hirsute garlic, is a Mediterranean species of wild onion. It is native to multiple regions across southern Europe, North Africa, and the Middle East, including France, Cyprus, Malta, Italy, Greece, Egypt, Turkey, Lebanon, Palestine, and Israel.'},
  {num:4,name:'Iberian Green Woodpecker',sci:'Picus sharpei',color:'#ff7f00',lat:40.413754698412696,lon:-3.6842265714285714,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Picus_viridis_sharpei_033.jpg/330px-Picus_viridis_sharpei_033.jpg',desc:'The Iberian green woodpecker is a medium-sized woodpecker found only on the Iberian peninsula. It was previously considered a subspecies of the European green woodpecker but differs in having minimal black coloring on the head and a dusky rather than black ring around each eye. It produces a distinctive hiss-like, sibilant sound.'},
  {num:5,name:'Brown Rat',sci:'Rattus norvegicus',color:'#984ea3',lat:40.413384,lon:-3.682099,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Brown_rat_%28Rattus_norvegicus%29_Drenthe_2.jpg/330px-Brown_rat_%28Rattus_norvegicus%29_Drenthe_2.jpg',desc:'The brown rat, also known as the common rat, Norway rat, and several other names, is a widespread species found on all continents except Antarctica. It is one of the largest rodents in its family, with brown or grey fur, a body length up to 28 cm, and a tail slightly shorter than its body. The brown rat is omnivorous, reproduces rapidly, lives primarily in human settlements, and can transmit diseases to humans.'}
];
const NARRATIVE_INTRO = "We venture now into the verdant heart of Retiro Park, Madrid's sprawling sanctuary of green. Here, where the city's pulse fades beneath the whisper of leaves and the song of hidden creatures, nature conducts its eternal symphony. Our journey will take us through five remarkable encounters\u2014from the humblest flower to the most elusive mammal\u2014each a testament to the intricate web of life that thrives in this urban oasis.";
const NARRATIVE_BY_SPECIES = ["Our first discovery awaits in the park's open meadows: Bellis perennis, the common daisy. These diminutive sentinels of the Asteraceae family dot the grass like tiny suns, their white petals ringed with pale rose\u2014the very flower from which all daisies take their humble name. Here, in this lawn-bound realm, the daisy has thrived for centuries, a modest yet unmistakable herald of spring's eternal return.", "Movement catches our eye among the trees ahead. A flash of black and white announces the arrival of Pica pica, the black-billed magpie\u2014or so one might assume. Yet here in Madrid's Retiro, we stand in the domain of its European cousin, a corvid of striking elegance with iridescent hints of blue-green dancing across its wings. Once thought a mere subspecies, this clever bird was recognized as distinct in the year 2000, a reminder that nature still holds secrets waiting to reveal themselves.", "As we venture deeper into the park's Mediterranean character, we encounter Allium neapolitanum, the Naples garlic\u2014a delicate wild onion bearing pink flowers that seem to glow against the dappled sunlight. This wanderer of southern Europe, at home from the shores of Malta to the mountains of Turkey, has found its way to Spain's gardens and wild places. It is a living bridge between continents, a botanical ambassador from lands far and sun-drenched.", "A distinctive hiss-like call echoes through the woodland canopy\u2014the voice of Picus sharpei, the Iberian green woodpecker, found nowhere else on Earth but the Iberian peninsula. This medium-sized artisan of the trees wears its colors with understated dignity: a dusky eye-ring rather than the bold black of its continental relatives, marking it as truly unique. We pause, listening to its sibilant song, humbled by the presence of a creature found nowhere else.", "As twilight approaches and we near the conclusion of our walk, we must acknowledge the presence of Rattus norvegicus, the brown rat\u2014a creature neither beloved nor welcome, yet undeniably successful. With fur of grey and brown, a body stretched to 28 centimetres, and a tail nearly its equal, this omnivorous survivor dwells in the shadows of human settlement, a reminder that even in our treasured parks, the wild competes for space, thriving in ways both seen and unseen."];
const CENTER = [40.41431159986772, -3.6838815466931214];
const ROUTE_COORDS = SPECIES.map(s => [s.lat, s.lon]);

function baseTileLayer(map) {
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap (CC-BY-SA)',
    maxZoom: 17
  }).addTo(map);
  L.polyline(ROUTE_COORDS, { color: '#333', weight: 2.5, opacity: 0.55, dashArray: '8,7' }).addTo(map);
}

function openQuestModal(i) {
  const s = SPECIES[i];
  const backdrop = document.createElement('div');
  backdrop.className = 'qa-modal-backdrop';
  backdrop.innerHTML = `
    <div class="qa-modal">
      <span class="qa-close">✕</span>
      <div style="font-size:11px;letter-spacing:1px;color:#7a5a2d">QUEST ENTRY ${s.num}/${SPECIES.length}</div>
      <h3 style="margin:4px 0 0">${s.name}</h3>
      <div style="font-style:italic;color:#7a5a2d;font-size:12px">${s.sci}</div>
      ${s.img ? `<img src="${s.img}"/>` : ''}
      <p style="font-size:13px;line-height:1.5">${s.desc}</p>
      <button class="qa-discover">Mark Discovered</button>
    </div>
  `;
  backdrop.querySelector('.qa-close').onclick = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
  backdrop.querySelector('.qa-discover').onclick = () => {
    const chk = document.querySelector(`[data-check="${i}"]`);
    if (chk) chk.style.visibility = 'visible';
    backdrop.remove();
  };
  document.body.appendChild(backdrop);
}

function render() {
  const container = document.getElementById('app');
  container.innerHTML = `
    <div class="qa-root">
      <div class="qa-titlebar">⚔ Retiro Park — A Nature Quest</div>
      <div class="qa-journal-tab" id="qa-tab">QUEST LOG</div>
      <div class="qa-journal" id="qa-journal">
        <h2>Quest Log</h2>
        <p style="font-size:13px;line-height:1.6;margin-bottom:16px">${NARRATIVE_INTRO}</p>
        ${SPECIES.map((s, i) => `
          <details class="qa-entry" data-idx="${i}">
            <summary><span class="qa-num">${s.num}</span> ${s.name} <span class="qa-check" data-check="${i}" style="visibility:hidden">✓</span></summary>
            <div class="qa-entry-body">${NARRATIVE_BY_SPECIES[i]}</div>
          </details>
        `).join('')}
      </div>
      <div class="qa-map-wrap">
        <div id="qa-map" class="map-fill"></div>
        <div class="map-noise qa-map-grain"></div>
        <div class="qa-map-vignette"></div>
      </div>
    </div>
  `;
  document.getElementById('qa-tab').onclick = () => document.getElementById('qa-journal').classList.toggle('open');

  const map = L.map('qa-map').setView(CENTER, 15);
  baseTileLayer(map);
  SPECIES.forEach((s, i) => {
    const icon = L.divIcon({ html: `<div class="qa-marker-medallion">${s.num}</div>`, iconSize: [36, 36], iconAnchor: [18, 18], className: '' });
    L.marker([s.lat, s.lon], { icon }).addTo(map).on('click', () => openQuestModal(i));
  });
}

render();
</script>
</body>
</html>
