<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PROTOTYPE — e2e walk spike (adventure-style quest log)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  .map-fill { position: absolute; inset: 0; }
  .map-noise {
    position: absolute; inset: 0; pointer-events: none; z-index: 450;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.35"/></svg>');
  }
  #run-banner {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5000;
    background: #111; color: #ffd700; padding: 6px 14px; border-radius: 999px;
    font-size: 11px; font-family: monospace; border: 2px solid #ffd700; max-width: 80vw;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .qa-root { position: absolute; inset: 0; background: #1b1f18; }
  .qa-titlebar {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: linear-gradient(#3a2f22, #2a2118); color: #e8d9b5; padding: 8px 24px;
    border: 2px solid #8a7346; border-radius: 6px; font-family: Georgia, serif;
    font-size: 16px; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  .qa-journal-tab {
    position: absolute; top: 90px; left: 0; z-index: 1000; background: #4a3a26;
    color: #e8d9b5; padding: 14px 8px; border-radius: 0 8px 8px 0; cursor: pointer;
    font-family: Georgia, serif; writing-mode: vertical-rl; border: 2px solid #8a7346;
    border-left: none; box-shadow: 3px 3px 10px rgba(0,0,0,.4); font-size: 13px;
  }
  .qa-journal {
    position: absolute; top: 0; left: -380px; width: 380px; height: 100%; z-index: 999;
    background: #f3e6c8 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4"><rect width="4" height="4" fill="%23f3e6c8"/><circle cx="1" cy="1" r=".4" fill="%23e3d3ab"/></svg>');
    border-right: 4px solid #4a3a26; box-shadow: 4px 0 24px rgba(0,0,0,.5);
    transition: left .35s ease; overflow-y: auto; padding: 70px 20px 20px;
    font-family: Georgia, serif; color: #3a2f1f;
  }
  .qa-journal.open { left: 0; }
  .qa-journal h2 { font-size: 20px; border-bottom: 2px solid #8a7346; padding-bottom: 8px; }
  .qa-entry { border: 1px solid #b8a06e; border-radius: 6px; margin-bottom: 10px; background: rgba(255,255,255,.35); }
  .qa-entry summary {
    padding: 10px 12px; cursor: pointer; font-weight: bold; display: flex;
    align-items: center; gap: 8px; list-style: none;
  }
  .qa-entry summary::-webkit-details-marker { display: none; }
  .qa-entry .qa-num {
    width: 22px; height: 22px; border-radius: 50%; background: #4a3a26; color: #f3e6c8;
    display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;
  }
  .qa-entry .qa-check { margin-left: auto; color: #2f6f2f; font-weight: bold; }
  .qa-entry-body { padding: 0 12px 12px 42px; font-size: 13.5px; line-height: 1.6; }
  .qa-map-wrap {
    position: absolute; inset: 14px; border-radius: 4px; overflow: hidden;
    box-shadow: 0 0 0 6px #2a2018, 0 0 0 10px #8a7346, 0 0 0 12px #3a2a15,
                inset 0 0 90px rgba(20,12,4,.75), 0 20px 50px rgba(0,0,0,.6);
  }
  .qa-map-wrap .leaflet-tile-pane {
    filter: sepia(.6) saturate(1.5) contrast(1.15) brightness(.82) hue-rotate(-8deg);
  }
  .qa-map-vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 460;
    background: radial-gradient(ellipse at center, rgba(58,42,21,0) 45%, rgba(30,20,8,.75) 100%);
    mix-blend-mode: multiply;
  }
  .qa-map-grain { mix-blend-mode: overlay; opacity: .5; }
  .qa-marker-medallion {
    background: radial-gradient(circle at 35% 30%, #d9c28a, #7a5a2d 70%); color: #2a1f10;
    border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center;
    justify-content: center; font-weight: bold; font-size: 15px; font-family: Georgia, serif;
    border: 2px solid #3a2a15; box-shadow: 0 3px 8px rgba(0,0,0,.5);
  }
  .qa-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 2000;
    display: flex; align-items: center; justify-content: center;
  }
  .qa-modal {
    width: 320px; background: #f3e6c8; border: 4px double #7a5a2d; border-radius: 4px;
    padding: 18px; font-family: Georgia, serif; color: #3a2f1f; position: relative;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
  }
  .qa-modal img { width: 100%; border-radius: 4px; border: 2px solid #7a5a2d; margin: 8px 0; }
  .qa-modal .qa-close { position: absolute; top: 8px; right: 10px; cursor: pointer; font-weight: bold; color: #7a5a2d; }
  .qa-modal button.qa-discover {
    margin-top: 10px; width: 100%; padding: 8px; background: #4a3a26; color: #f3e6c8;
    border: none; border-radius: 4px; cursor: pointer; font-family: Georgia, serif;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="run-banner">PROTOTYPE — e2e walk spike · query: &quot;Surprise me&quot;</div>
<script>
const SPECIES = [
  {num:1,name:'Common Wood Pigeon',sci:'Columba palumbus',color:'#e41a1c',lat:40.41945756944445,lon:-3.661329006944444,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/Columba_palumbus_EM1B1397_%2827445478998%29.jpg/330px-Columba_palumbus_EM1B1397_%2827445478998%29.jpg',desc:'The common wood pigeon is a large pigeon native to the western Palearctic region. It belongs to the genus Columba and has a flexible diet, feeding mainly on plant material including cereals, which makes it an agricultural pest in some areas. Wood pigeons are extensively hunted throughout much of their range, but their population numbers remain stable.'},
  {num:2,name:'Black-billed Magpie',sci:'Pica pica',color:'#377eb8',lat:40.41950714102564,lon:-3.6613389487179484,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/BlackBilledMagpie.jpg/330px-BlackBilledMagpie.jpg',desc:'The black-billed magpie is a corvid found in the western half of North America. It is black and white with iridescent blue and blue-green hints visible on its wings and tail. Originally considered a subspecies of Pica pica, it was classified as a separate species in 2000 based on genetic studies.'},
  {num:3,name:'Common Pigeon',sci:'Columba livia',color:'#4daf4a',lat:40.41961126811594,lon:-3.661650847826087,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Columba_livia_%28Rock_Dove%2C_wild%29%2C_Duncansby_Head%2C_Caithness%2C_Scotland_1.jpg/330px-Columba_livia_%28Rock_Dove%2C_wild%29%2C_Duncansby_Head%2C_Caithness%2C_Scotland_1.jpg',desc:'The rock dove, commonly called the pigeon or rock pigeon, is a member of the Columbidae family. The wild form is the rock dove, while the pigeons most people encounter are domesticated descendants of this original species.'},
  {num:4,name:'Blackbird',sci:'Turdus merula',color:'#ff7f00',lat:40.41986939189189,lon:-3.661315013513513,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Common_Blackbird.jpg/330px-Common_Blackbird.jpg',desc:'The common blackbird, also known as the Eurasian blackbird, is a species of true thrush. It breeds across Europe, western Asia, and North Africa, and has been introduced to Australia and New Zealand. Depending on latitude, populations may be resident, partially migratory, or fully migratory.'},
  {num:5,name:'Monk Parakeet',sci:'Myiopsitta monachus',color:'#984ea3',lat:40.41971299328859,lon:-3.661093134228188,img:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d1/Monk_parakeet_%28Myiopsitta_monachus%29_Santiago.jpg/330px-Monk_parakeet_%28Myiopsitta_monachus%29_Santiago.jpg',desc:'The monk parakeet is a small to medium parrot with bright-green plumage, a greyish breast, and greenish-yellow abdomen. It originates from temperate to subtropical areas of South America and has an average lifespan of about 15 years. Self-sustaining feral populations now occur in many places, particularly in similar climates in North America and Europe.'}
];
const NARRATIVE_INTRO = "We emerge into the sprawling embrace of Retiro Park, Madrid's verdant sanctuary where centuries of royal grandeur have given way to a thriving ecosystem. The afternoon light filters through a canopy of ancient trees, and already, the air thrums with the subtle symphonies of urban wildlife. Here, in this corner of the Spanish capital, nature has woven itself seamlessly into the fabric of human civilization\u2014and we are about to witness the remarkable creatures that call this place home.";
const NARRATIVE_BY_SPECIES = ["Our first encounter brings us face to face with the Common Wood Pigeon, a substantial and imposing figure perched amongst the park's towering branches. With its distinctive white neck patch gleaming like a pearl against slate-grey plumage, this native of the western Palearctic sits with the unhurried confidence of a bird that has thrived for millennia. Though hunted throughout its range, the wood pigeon's flexibility\u2014its willingness to feast on cereals, seeds, and shoots\u2014has allowed its population to remain remarkably resilient, even in the face of human interference.", "We move deeper into the park, and suddenly, a flash of iridescent blue catches our eye\u2014the Black-billed Magpie, resplendent in its contrasting black and white plumage. Though originally thought a mere subspecies of its European cousins, genetic studies revealed this corvid's true distinctness in the year 2000, elevating it to its rightful status as a separate species. Here in Madrid's gardens, far from its native North American haunts, it represents nature's capacity for surprise\u2014a reminder that discovery awaits even in the most unexpected of places.", "We arrive at a cobbled plaza where dozens of Common Pigeons congregate, their heads bobbing rhythmically as they search for sustenance among the stones. These are the descendants of the rock dove, transformed through countless generations of domestication from wild cliff-dwellers into the ubiquitous urban companion we know today. In their humble presence, we see not mere vermin, but living bridges between wilderness and civilization\u2014testament to humanity's ancient partnership with the animal kingdom.", "The air grows richer with birdsong, and we pause to listen as a magnificent Blackbird\u2014a male, judging by his glossy jet plumage and golden eye-ring\u2014delivers his flute-like evening chorus from a hidden perch. This Eurasian thrush, which breeds across the entirety of Europe and beyond, has adapted to life in every conceivable habitat, from wild moorlands to suburban gardens to the very heart of Madrid. Depending on where it was born, this individual may be a permanent resident or a traveler who journeys thousands of miles with the seasons\u2014a living testament to nature's intricate migrations.", "As the sun begins its descent, we hear a distinctive, raucous call\u2014and there, impossibly, a flock of brilliant green Monk Parakeets swoops overhead, their breasts flashing grey against the amber light. These South American natives, with their charming greyish-white fronts and greenish-yellow undersides, represent one of nature's great unexpected triumphs: a species that, released or escaped into foreign lands, has not merely survived but flourished, establishing self-sustaining colonies across continents. In Retiro Park, thousands of miles from their ancestral temperate forests, they have found not just a home, but a thriving dynasty\u2014a remarkable testament to adaptability and resilience."];
const CENTER = [40.419631672753304, -3.6613453902460362];
const ROUTE_COORDS = SPECIES.map(s => [s.lat, s.lon]);

function baseTileLayer(map) {
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap (CC-BY-SA)',
    maxZoom: 17
  }).addTo(map);
  L.polyline(ROUTE_COORDS, { color: '#333', weight: 2.5, opacity: 0.55, dashArray: '8,7' }).addTo(map);
}

function openQuestModal(i) {
  const s = SPECIES[i];
  const backdrop = document.createElement('div');
  backdrop.className = 'qa-modal-backdrop';
  backdrop.innerHTML = `
    <div class="qa-modal">
      <span class="qa-close">✕</span>
      <div style="font-size:11px;letter-spacing:1px;color:#7a5a2d">QUEST ENTRY ${s.num}/${SPECIES.length}</div>
      <h3 style="margin:4px 0 0">${s.name}</h3>
      <div style="font-style:italic;color:#7a5a2d;font-size:12px">${s.sci}</div>
      ${s.img ? `<img src="${s.img}"/>` : ''}
      <p style="font-size:13px;line-height:1.5">${s.desc}</p>
      <button class="qa-discover">Mark Discovered</button>
    </div>
  `;
  backdrop.querySelector('.qa-close').onclick = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
  backdrop.querySelector('.qa-discover').onclick = () => {
    const chk = document.querySelector(`[data-check="${i}"]`);
    if (chk) chk.style.visibility = 'visible';
    backdrop.remove();
  };
  document.body.appendChild(backdrop);
}

function render() {
  const container = document.getElementById('app');
  container.innerHTML = `
    <div class="qa-root">
      <div class="qa-titlebar">⚔ Retiro Park — A Nature Quest</div>
      <div class="qa-journal-tab" id="qa-tab">QUEST LOG</div>
      <div class="qa-journal" id="qa-journal">
        <h2>Quest Log</h2>
        <p style="font-size:13px;line-height:1.6;margin-bottom:16px">${NARRATIVE_INTRO}</p>
        ${SPECIES.map((s, i) => `
          <details class="qa-entry" data-idx="${i}">
            <summary><span class="qa-num">${s.num}</span> ${s.name} <span class="qa-check" data-check="${i}" style="visibility:hidden">✓</span></summary>
            <div class="qa-entry-body">${NARRATIVE_BY_SPECIES[i]}</div>
          </details>
        `).join('')}
      </div>
      <div class="qa-map-wrap">
        <div id="qa-map" class="map-fill"></div>
        <div class="map-noise qa-map-grain"></div>
        <div class="qa-map-vignette"></div>
      </div>
    </div>
  `;
  document.getElementById('qa-tab').onclick = () => document.getElementById('qa-journal').classList.toggle('open');

  const map = L.map('qa-map').setView(CENTER, 15);
  baseTileLayer(map);
  SPECIES.forEach((s, i) => {
    const icon = L.divIcon({ html: `<div class="qa-marker-medallion">${s.num}</div>`, iconSize: [36, 36], iconAnchor: [18, 18], className: '' });
    L.marker([s.lat, s.lon], { icon }).addTo(map).on('click', () => openQuestModal(i));
  });
}

render();
</script>
</body>
</html>
